<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4e79">
<title>Nosso Caixa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#f5f3ee; --surface:#ffffff; --surface-2:#faf9f6; --ink:#1b2230; --muted:#6a7180; --line:#e5e1d8;
  --accent:#1f4e79; --accent-ink:#ffffff; --accent-soft:#e3ecf5; --amber:#c8873a;
  --pos:#21825b; --pos-soft:#e2f2ea; --neg:#c03d2b; --neg-soft:#f8e5e1; --warn:#a86d14; --warn-soft:#f7ecd9;
  --shadow:0 1px 2px rgba(20,24,33,.05),0 4px 16px rgba(20,24,33,.05);
  --r:14px; --side:236px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11141a; --surface:#191e26; --surface-2:#151a21; --ink:#e7e5e0; --muted:#9aa1ad; --line:#2a313c;
    --accent:#6fa8dc; --accent-ink:#0d1520; --accent-soft:#1d2a3a; --amber:#e0a35a;
    --pos:#4cc38a; --pos-soft:#16302a; --neg:#ef6a55; --neg-soft:#3a1f1c; --warn:#e3a94a; --warn-soft:#352a17;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#11141a; --surface:#191e26; --surface-2:#151a21; --ink:#e7e5e0; --muted:#9aa1ad; --line:#2a313c;
  --accent:#6fa8dc; --accent-ink:#0d1520; --accent-soft:#1d2a3a; --amber:#e0a35a;
  --pos:#4cc38a; --pos-soft:#16302a; --neg:#ef6a55; --neg-soft:#3a1f1c; --warn:#e3a94a; --warn-soft:#352a17;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hidden{display:none!important}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--line);background:var(--surface-2);display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 10px 18px;font-weight:800;font-size:18px;letter-spacing:-.02em}
.brand .logo{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:15px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:600}
.nav a:hover{background:var(--accent-soft);color:var(--ink)}
.nav a.on{background:var(--accent);color:var(--accent-ink)}
.side .foot{margin-top:auto;font-size:12px;color:var(--muted);padding:10px 12px}
.side{overflow-y:auto}
.nav .grp{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--muted);font-weight:600;cursor:pointer;width:100%;border:0;background:transparent;text-align:left}
.nav .grp:hover{background:var(--accent-soft);color:var(--ink)}
.nav .grp .car{margin-left:auto;width:16px;height:16px;transition:transform .2s}
.nav .grp.fechado .car{transform:rotate(-90deg)}
.nav .grp.fechado + .subnav{display:none}
.nav .subnav a{padding:8px 12px 8px 44px;font-size:14px}
.tbl-mini{width:100%;font-size:14px}
.tbl-mini td,.tbl-mini th{padding:8px 4px}
.tbl-mini tfoot td{font-weight:800;border-bottom:0}
.it{font-style:italic;color:var(--muted)}
.steps{display:flex;gap:6px;margin:0 0 18px}
.steps i{flex:1;height:5px;border-radius:9px;background:var(--line)}
.steps i.on{background:var(--accent)}
.sqlbox{width:100%;height:150px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px;resize:vertical}
.login .box.wide{max-width:520px}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:700;cursor:pointer;padding:6px 0;text-decoration:underline}
.main{min-width:0;padding:22px 30px 100px;max-width:1240px}
.top{display:flex;align-items:center;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.top h1{font-size:24px;letter-spacing:-.02em;margin:0;flex:1;min-width:150px}
.icon-btn.burger{display:none}
.mes{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.mes span{min-width:132px;text-align:center;font-weight:700;font-size:14px;text-transform:capitalize}
.icon-btn{width:34px;height:34px;border-radius:999px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.icon-btn:hover{background:var(--accent-soft)}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:10px;font-weight:700;cursor:pointer;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--neg)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent}
.fab{display:none;position:fixed;right:22px;bottom:22px;width:56px;height:56px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 20px rgba(31,78,121,.35);cursor:pointer;z-index:30;place-items:center}
.fab svg.i{width:26px;height:26px;stroke-width:2.2}

/* ---------- cards ---------- */
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.two{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;min-width:0}
.card h3{margin:0 0 12px;font-size:14px;font-weight:800;letter-spacing:.01em;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h3 .sub{font-weight:600;color:var(--muted);font-size:12px}
.kpi .lbl{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.kpi .val{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:6px}
.kpi .foot{font-size:12px;color:var(--muted);margin-top:4px}
.pos{color:var(--pos)} .neg{color:var(--neg)} .muted{color:var(--muted)} .warn{color:var(--warn)}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.pos{background:var(--pos-soft);border-color:transparent;color:var(--pos)}
.chip.neg{background:var(--neg-soft);border-color:transparent;color:var(--neg)}
.chip.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.chip.acc{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.bar{height:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--accent)}
.empty{padding:26px 10px;text-align:center;color:var(--muted)}
.empty .btn{margin-top:10px}
.banner{display:flex;align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap;background:var(--accent-soft);border-radius:var(--r);padding:16px 18px;margin-bottom:16px}
.chart-box{position:relative;height:250px}
.check{width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line);background:transparent;display:grid;place-items:center;cursor:pointer;flex:none;color:transparent}
.check.on{background:var(--pos);border-color:var(--pos);color:#fff}
.check svg.i{width:15px;height:15px;stroke-width:3}
.clickable{cursor:pointer}
.clickable:hover .t{color:var(--accent)}

/* ---------- lançamentos ---------- */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filters input,.filters select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.filters input{flex:1 1 200px}
.day{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between;padding:14px 0 4px}
.lanc .val{font-weight:800;white-space:nowrap}
.totals{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:12px}
.totals b{font-size:15px}

/* ---------- cartões / contas ---------- */
.acct{border-radius:var(--r);padding:18px;color:#fff;position:relative;overflow:hidden;min-height:150px;display:flex;flex-direction:column;cursor:pointer;box-shadow:var(--shadow)}
.acct::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.1)}
.acct .n{font-weight:800;font-size:16px}
.acct .tp{font-size:12px;opacity:.8}
.acct .v{margin-top:auto;font-size:24px;font-weight:800;letter-spacing:-.02em}
.acct .p{font-size:12px;opacity:.85}
.acct.off{opacity:.55}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:999px;font-weight:700;font-size:13px;cursor:pointer}
.tab.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.fat-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.big{font-size:28px;font-weight:800;letter-spacing:-.02em}

/* ---------- tabelas ---------- */
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:800;padding:8px 6px;border-bottom:1px solid var(--line)}
td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
.orc-in{width:120px;text-align:right;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 8px}

/* ---------- modal / form ---------- */
.overlay{position:fixed;inset:0;background:rgba(10,14,20,.45);display:grid;place-items:center;z-index:50;padding:16px;animation:fade .15s}
.modal{background:var(--surface);border-radius:18px;width:100%;max-width:520px;max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal header{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 6px}
.modal header h2{margin:0;font-size:18px}
.modal .body{padding:8px 20px 4px}
.modal footer{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px 18px;flex-wrap:wrap}
.modal footer .left{margin-right:auto}
@keyframes fade{from{opacity:0}to{opacity:1}}
.f{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.f label{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.f input,.f select,.f textarea{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.f input:focus,.f select:focus,.f textarea:focus,.filters input:focus,.filters select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.f input[type=color]{padding:2px;height:42px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:14px}
.seg button{border:0;background:transparent;padding:8px;border-radius:9px;font-weight:800;cursor:pointer;color:var(--muted)}
.seg button.on[data-t=despesa]{background:var(--neg);color:#fff}
.seg button.on[data-t=receita]{background:var(--pos);color:#fff}
.seg button.on[data-t=transferencia]{background:var(--accent);color:var(--accent-ink)}
.inline{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:12px;cursor:pointer}
.inline input{width:18px;height:18px;accent-color:var(--pos)}
.valor-in{font-size:24px!important;font-weight:800}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:11px 18px;border-radius:12px;font-weight:700;z-index:80;box-shadow:var(--shadow);max-width:90vw}
.toast.err{background:var(--neg);color:#fff}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login .box{width:100%;max-width:380px}
.login .brand{justify-content:center;font-size:24px;padding-bottom:6px}
.login p.lead{text-align:center;color:var(--muted);margin:0 0 22px}
.err-msg{color:var(--neg);font-weight:700;font-size:13px;margin-bottom:10px}
.loading{min-height:60vh;display:grid;place-items:center;color:var(--muted);font-weight:700}

/* ---------- responsivo ---------- */
@media (max-width:1080px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.three{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:60;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow);background:var(--surface)}
  .side.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:55}
  .icon-btn.burger{display:grid}
  .fab{display:grid}
  .main{padding:14px 16px 110px}
  .top{gap:8px;margin-bottom:16px}
  .top h1{font-size:20px}
  .mes{order:3;width:100%;justify-content:space-between}
  .two,.three{grid-template-columns:1fr}
  .kpi .val{font-size:20px}
  .fr{grid-template-columns:1fr 1fr}
  .orc-in{width:96px}
  .hide-m{display:none}
}
@media (max-width:420px){.kpis{gap:10px}.card{padding:14px}}
</style>

<body>
<div id="root"></div>
<script type="text/plain" id="sqlSchema">
-- =====================================================================
--  NOSSO CAIXA · Esquema do banco (Supabase / PostgreSQL)
--  Como usar: Supabase > SQL Editor > New query > cole tudo > Run
--  Pode ser executado de novo sem problema (não apaga dados).
-- =====================================================================

-- ---------- CONTAS (corrente, poupança, carteira, investimento) ----------
create table if not exists public.contas (
  id            uuid primary key default gen_random_uuid(),
  user_id       uuid not null default auth.uid() references auth.users(id) on delete cascade,
  nome          text not null,
  tipo          text not null default 'corrente'
                check (tipo in ('corrente','poupanca','carteira','investimento','outra')),
  saldo_inicial numeric(14,2) not null default 0,
  cor           text not null default '#2f7d6d',
  arquivada     boolean not null default false,
  criado_em     timestamptz not null default now()
);

-- ---------- CARTÕES DE CRÉDITO ----------
create table if not exists public.cartoes (
  id             uuid primary key default gen_random_uuid(),
  user_id        uuid not null default auth.uid() references auth.users(id) on delete cascade,
  nome           text not null,
  limite         numeric(14,2) not null default 0,
  dia_fechamento int  not null check (dia_fechamento between 1 and 31),
  dia_vencimento int  not null check (dia_vencimento between 1 and 31),
  conta_id       uuid references public.contas(id) on delete set null, -- conta que paga a fatura
  cor            text not null default '#6b4fa3',
  arquivado      boolean not null default false,
  criado_em      timestamptz not null default now()
);

-- ---------- CATEGORIAS ----------
create table if not exists public.categorias (
  id        uuid primary key default gen_random_uuid(),
  user_id   uuid not null default auth.uid() references auth.users(id) on delete cascade,
  nome      text not null,
  tipo      text not null check (tipo in ('receita','despesa')),
  cor       text not null default '#888888',
  criado_em timestamptz not null default now()
);

-- ---------- LANÇAMENTOS ----------
-- tipo:
--   receita / despesa  -> em conta (conta_id) ou, se despesa, no cartão (cartao_id + fatura_mes)
--   transferencia      -> de conta_id para conta_destino_id
--   pagamento_fatura   -> sai de conta_id e quita a fatura (cartao_id + fatura_mes)
create table if not exists public.lancamentos (
  id               uuid primary key default gen_random_uuid(),
  user_id          uuid not null default auth.uid() references auth.users(id) on delete cascade,
  tipo             text not null check (tipo in ('receita','despesa','transferencia','pagamento_fatura')),
  descricao        text not null,
  valor            numeric(14,2) not null check (valor >= 0),
  data             date not null,
  pago             boolean not null default true,
  categoria_id     uuid references public.categorias(id) on delete set null,
  conta_id         uuid references public.contas(id) on delete cascade,
  conta_destino_id uuid references public.contas(id) on delete cascade,
  cartao_id        uuid references public.cartoes(id) on delete cascade,
  fatura_mes       date,          -- 1º dia do mês de vencimento da fatura
  grupo_id         uuid,          -- liga parcelas/repetições de um mesmo lançamento
  parcela          int,
  total_parcelas   int,
  observacao       text,
  criado_por       text,          -- "Bruno" / "Esposa" (opcional, só para registro)
  criado_em        timestamptz not null default now()
);
create index if not exists lanc_user_data   on public.lancamentos(user_id, data);
create index if not exists lanc_user_fatura on public.lancamentos(user_id, cartao_id, fatura_mes);
create index if not exists lanc_grupo       on public.lancamentos(grupo_id);

-- ---------- ORÇAMENTO (limite de gasto por categoria e mês) ----------
create table if not exists public.orcamentos (
  id           uuid primary key default gen_random_uuid(),
  user_id      uuid not null default auth.uid() references auth.users(id) on delete cascade,
  categoria_id uuid not null references public.categorias(id) on delete cascade,
  mes          date not null,     -- 1º dia do mês
  valor        numeric(14,2) not null check (valor >= 0),
  unique (user_id, categoria_id, mes)
);

-- ---------- METAS / OBJETIVOS ----------
create table if not exists public.metas (
  id          uuid primary key default gen_random_uuid(),
  user_id     uuid not null default auth.uid() references auth.users(id) on delete cascade,
  nome        text not null,
  valor_alvo  numeric(14,2) not null check (valor_alvo > 0),
  valor_atual numeric(14,2) not null default 0,
  data_alvo   date,
  cor         text not null default '#c8873a',
  criado_em   timestamptz not null default now()
);

-- =====================================================================
--  SEGURANÇA (Row Level Security): cada login só enxerga os próprios dados
-- =====================================================================
do $$
declare t text;
begin
  foreach t in array array['contas','cartoes','categorias','lancamentos','orcamentos','metas'] loop
    execute format('alter table public.%I enable row level security', t);
    execute format('drop policy if exists "dono_%s" on public.%I', t, t);
    execute format(
      'create policy "dono_%s" on public.%I for all to authenticated
         using (user_id = auth.uid()) with check (user_id = auth.uid())', t, t);
  end loop;
end $$;

-- =====================================================================
--  TRAVA: só é possível criar UM login (o do casal).
--  Depois que o primeiro acesso for criado, ninguém mais consegue se cadastrar.
--  (Para remover a trava: drop trigger limitar_um_usuario on auth.users;)
-- =====================================================================
create or replace function public.limitar_um_usuario() returns trigger
language plpgsql security definer set search_path = public as $$
begin
  if (select count(*) from auth.users) >= 1 then
    raise exception 'NOSSO_CAIXA_JA_TEM_ACESSO';
  end if;
  return new;
end $$;
drop trigger if exists limitar_um_usuario on auth.users;
create trigger limitar_um_usuario before insert on auth.users
  for each row execute function public.limitar_um_usuario();
</script>

// Efeito de um lançamento no saldo de uma conta
function efeitoConta(l, contaId) {
  const v = num(l.valor);
  if (l.tipo === 'receita' && l.conta_id === contaId && !l.cartao_id) return v;
  if (l.tipo === 'despesa' && l.conta_id === contaId && !l.cartao_id) return -v;
  if (l.tipo === 'pagamento_fatura' && l.conta_id === contaId) return -v;
  if (l.tipo === 'transferencia') {
    if (l.conta_id === contaId) return -v;
    if (l.conta_destino_id === contaId) return v;
  }
  return 0;
}
// opts.ate: considera só lançamentos até essa data; opts.pendentes: inclui os não pagos
function saldoConta(contaId, opts = {}) {
  const c = byId('contas', contaId);
  let s = num(c?.saldo_inicial);
  for (const l of S.lancamentos) {
    if (!l.pago && !opts.pendentes) continue;
    if (opts.ate && l.data > opts.ate) continue;
    s += efeitoConta(l, contaId);
  }
  return Math.round(s * 100) / 100;
}
// Mês (YYYY-MM) da fatura em que cai uma compra feita na data ds
function faturaYM(cartao, ds) {
  const ym = ds.slice(0, 7), d = +ds.slice(8, 10);
  const [y, m] = ym.split('-').map(Number);
  const fech = Math.min(cartao.dia_fechamento, diasNoMes(y, m));
  const fechYM = d >= fech ? addMeses(ym, 1) : ym;
  return cartao.dia_vencimento > cartao.dia_fechamento ? fechYM : addMeses(fechYM, 1);
}
function faturaInfo(cartao, fym) {
  const itens = S.lancamentos.filter(l => l.tipo === 'despesa' && l.cartao_id === cartao.id && (l.fatura_mes || '').slice(0, 7) === fym)
    .sort((a, b) => a.data < b.data ? -1 : a.data > b.data ? 1 : 0);
  const pagamentos = S.lancamentos.filter(l => l.tipo === 'pagamento_fatura' && l.cartao_id === cartao.id && (l.fatura_mes || '').slice(0, 7) === fym);
  const total = Math.round(soma(itens) * 100) / 100;
  const pago = Math.round(soma(pagamentos) * 100) / 100;
  const fechYM = cartao.dia_vencimento > cartao.dia_fechamento ? fym : addMeses(fym, -1);
  const fechamento = dataNoMes(fechYM, cartao.dia_fechamento);
  const vencimento = dataNoMes(fym, cartao.dia_vencimento);
  const h = hoje();
  let status;
  if (total <= 0) status = pago > 0 ? 'paga' : 'vazia';
  else if (pago >= total - 0.004) status = 'paga';
  else if (h < fechamento) status = 'aberta';
  else if (h <= vencimento) status = 'fechada';
  else status = 'vencida';
  return { itens, pagamentos, total, pago, restante: Math.max(0, Math.round((total - pago) * 100) / 100), fechamento, vencimento, status };
}
function usoCartao(cartao) {
  const compras = soma(S.lancamentos.filter(l => l.tipo === 'despesa' && l.cartao_id === cartao.id));
  const pagos = soma(S.lancamentos.filter(l => l.tipo === 'pagamento_fatura' && l.cartao_id === cartao.id));
  const usado = Math.max(0, compras - pagos);
  return { usado, disponivel: num(cartao.limite) - usado };
}

/* ---------------- dados (Supabase) ---------------- */
async function fetchAll(t) {
  const out = []; let from = 0;
  for (;;) {
    const { data, error } = await sb.from(t).select('*').order('id').range(from, from + 999);
    if (error) throw error;
    out.push(...data);
    if (data.length < 1000) break;
    from += 1000;
  }
  return out;
}
async function carregar(tabelas = TABELAS) {
  const res = await Promise.all(tabelas.map(fetchAll));
  tabelas.forEach((t, i) => S[t] = res[i]);
  S.carregadoEm = Date.now();
}
async function op(promessa, msgOk) {
  const { error, data } = await promessa;
  if (error) { toast('Erro: ' + traduzErro(error), true); throw error; }
  if (msgOk) toast(msgOk);
  return data;
}
function traduzErro(e) {
  const m = e?.message || String(e);
  if (/Invalid login credentials/i.test(m)) return 'e-mail ou senha incorretos.';
  if (/Failed to fetch|NetworkError/i.test(m)) return 'sem conexão com o servidor.';
  if (/relation .* does not exist|Could not find the table|schema cache/i.test(m)) return 'tabelas não encontradas — execute o SQL no Supabase.';
  if (/Invalid API key|No API key/i.test(m)) return 'chave do Supabase inválida.';
  if (/NOSSO_CAIXA_JA_TEM_ACESSO|Database error saving new user/i.test(m)) return 'já existe um acesso criado neste Nosso Caixa. Use “Entrar”.';
  if (/User already registered/i.test(m)) return 'este e-mail já tem acesso. Use “Entrar”.';
  if (/Signups not allowed|signup.*disabled/i.test(m)) return 'novos cadastros estão desativados no Supabase. Use “Entrar” ou crie o usuário pelo painel do Supabase.';
  if (/Password should be at least/i.test(m)) return 'a senha precisa ter pelo menos 6 caracteres.';
  if (/Email not confirmed/i.test(m)) return 'e-mail ainda não confirmado: abra o link que o Supabase enviou para o seu e-mail.';
  if (/rate limit/i.test(m)) return 'muitas tentativas seguidas. Aguarde alguns minutos.';
  return m;
}
const tabelaFaltando = e => /relation .* does not exist|Could not find the table|schema cache|42P01|PGRST205/i.test((e?.message || '') + ' ' + (e?.code || ''));
async function salvar(tabela, dados, id, msg) {
  if (id) await op(sb.from(tabela).update(dados).eq('id', id), msg);
  else await op(sb.from(tabela).insert(dados), msg);
}
async function excluir(tabela, ids, msg) {
  ids = Array.isArray(ids) ? ids : [ids];
  await op(sb.from(tabela).delete().in('id', ids), msg);
}
async function recarregarERender(tabelas) {
  try { await carregar(tabelas); } catch (e) { toast('Erro ao atualizar: ' + traduzErro(e), true); }
  render();
}

}

function barraOrc(catId, gasto, limite) {

}
function barraMeta(m) {

/* =====================================================================
   LANÇAMENTOS
   ===================================================================== */
function vLancamentos() {
  const F = S.filtro, ym = S.mes;
  const busca = F.busca.trim().toLowerCase();
  let lista = S.lancamentos.filter(l => noMes(l, ym));
  if (F.tipo) lista = lista.filter(l => l.tipo === F.tipo);
  if (F.cat) lista = lista.filter(l => (l.categoria_id || '_') === F.cat);
  if (F.status === 'pendente') lista = lista.filter(l => !l.pago && !l.cartao_id);
  if (F.status === 'pago') lista = lista.filter(l => l.pago || l.cartao_id);
  if (F.onde) {
    const [k, id] = F.onde.split(':');
    lista = lista.filter(l => k === 'cartao' ? l.cartao_id === id : (l.conta_id === id && !l.cartao_id) || l.conta_destino_id === id);
  }
  if (busca) lista = lista.filter(l => (l.descricao + ' ' + (l.observacao || '') + ' ' + nomeCat(l.categoria_id)).toLowerCase().includes(busca));
  lista.sort((a, b) => a.data !== b.data ? (a.data < b.data ? 1 : -1) : (a.criado_em < b.criado_em ? 1 : -1));

  const tRec = soma(lista.filter(l => l.tipo === 'receita'));
  const tDesp = soma(lista.filter(l => l.tipo === 'despesa'));
  const dias = new Map();
  for (const l of lista) { if (!dias.has(l.data)) dias.set(l.data, []); dias.get(l.data).push(l); }

  const optOnde = `<option value="">Todas as contas e cartões</option>
    <optgroup label="Contas">${S.contas.map(c => `<option value="conta:${c.id}" ${F.onde === 'conta:' + c.id ? 'selected' : ''}>${esc(c.nome)}</option>`).join('')}</optgroup>
    <optgroup label="Cartões">${S.cartoes.map(c => `<option value="cartao:${c.id}" ${F.onde === 'cartao:' + c.id ? 'selected' : ''}>${esc(c.nome)}</option>`).join('')}</optgroup>`;
  const cats = [...S.categorias].sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));
  return `
  <div class="filters">
    <input type="search" placeholder="Buscar descrição, observação, categoria…" data-filtro="busca" value="${esc(F.busca)}">
    <select data-filtro="tipo"><option value="">Todos os tipos</option>
      ${[['despesa', 'Despesas'], ['receita', 'Receitas'], ['transferencia', 'Transferências'], ['pagamento_fatura', 'Pagamentos de fatura']].map(([v, n]) => `<option value="${v}" ${F.tipo === v ? 'selected' : ''}>${n}</option>`).join('')}</select>
    <select data-filtro="onde">${optOnde}</select>
    <select data-filtro="cat"><option value="">Todas as categorias</option>${cats.map(c => `<option value="${c.id}" ${F.cat === c.id ? 'selected' : ''}>${esc(c.nome)}</option>`).join('')}<option value="_" ${F.cat === '_' ? 'selected' : ''}>Sem categoria</option></select>
    <select data-filtro="status"><option value="">Pagos e pendentes</option><option value="pendente" ${F.status === 'pendente' ? 'selected' : ''}>Só pendentes</option><option value="pago" ${F.status === 'pago' ? 'selected' : ''}>Só pagos</option></select>
    ${(F.busca || F.tipo || F.onde || F.cat || F.status) ? '<button class="btn sm ghost" data-act="limparFiltro">Limpar filtros</button>' : ''}
  </div>
  <div class="totals"><span>${lista.length} lançamento${lista.length === 1 ? '' : 's'}</span>
    <span>Receitas <b class="num pos">${fmt(tRec)}</b></span><span>Despesas <b class="num neg">${fmt(tDesp)}</b></span>
    <span>Resultado <b class="num ${tRec - tDesp < 0 ? 'neg' : 'pos'}">${fmt(tRec - tDesp)}</b></span></div>
  <div class="card" style="padding-top:6px">
    ${lista.length ? [...dias.entries()].map(([d, ls]) => {
      const tot = soma(ls, l => l.tipo === 'receita' ? l.valor : l.tipo === 'despesa' ? -l.valor : 0);
      return `<div class="day"><span>${diaSemana(d)}, ${dataBR(d).slice(0, 5)}</span><span class="num ${tot < 0 ? 'neg' : tot > 0 ? 'pos' : ''}">${tot ? fmt(tot) : ''}</span></div>` + ls.map(linhaLanc).join('');
    }).join('') : `<div class="empty">Nenhum lançamento encontrado em ${nomeMes(ym)}.<br><button class="btn" data-act="novoLanc">${ic('plus')}Novo lançamento</button></div>`}
  </div>`;
}
function linhaLanc(l) {
  const sinal = l.tipo === 'receita' ? 'pos' : l.tipo === 'despesa' ? 'neg' : '';
  const prefixo = l.tipo === 'receita' ? '+ ' : l.tipo === 'despesa' ? '− ' : '';
  const cat = l.tipo === 'transferencia' ? 'Transferência' : l.tipo === 'pagamento_fatura' ? 'Pagamento de fatura' : nomeCat(l.categoria_id);
  const cor = l.tipo === 'transferencia' || l.tipo === 'pagamento_fatura' ? css('--accent') : corCat(l.categoria_id);
  const podeMarcar = !l.cartao_id || l.tipo === 'pagamento_fatura';
  return `<div class="row lanc">
    ${podeMarcar ? `<button class="check ${l.pago ? 'on' : ''}" data-act="togglePago" data-id="${l.id}" title="${l.pago ? 'Pago — clique para marcar como pendente' : 'Pendente — clique para marcar como pago'}">${ic('check')}</button>`
      : `<span class="check on" style="background:${esc(byId('cartoes', l.cartao_id)?.cor || css('--accent'))};border-color:transparent;cursor:default" title="Compra no cartão">${ic('cartoes')}</span>`}
    <div class="grow clickable" data-act="editLanc" data-id="${l.id}">
      <div class="t">${esc(l.descricao)}${l.total_parcelas > 1 ? ` <span class="chip">${l.parcela}/${l.total_parcelas}</span>` : ''}</div>
      <div class="s"><span class="dot" style="display:inline-block;width:8px;height:8px;background:${esc(cor)}"></span> ${esc(cat)} · ${esc(ondeTexto(l))}${l.criado_por ? ' · ' + esc(l.criado_por) : ''}${!l.pago && podeMarcar ? ' <span class="chip warn">pendente</span>' : ''}</div>
    </div>
    <div class="val num ${sinal}">${prefixo}${fmt(l.valor)}</div></div>`;
}

  <div class="card">

      <thead><tr><th>Categoria</th><th class="r">Limite</th><th class="r">Gasto</th><th class="r hide-m">Restante</th><th style="width:28%" class="hide-m">Uso</th></tr></thead>
      <tbody>${linhas.map(({ c, o, gasto }) => {

      ${semCat ? `<tr><td class="muted">Sem categoria</td><td></td><td class="r num">${fmt(semCat)}</td><td class="hide-m"></td><td class="hide-m"></td></tr>` : ''}</tbody>

/* =====================================================================
   RELATÓRIOS
   ===================================================================== */
function vRelatorios(pos) {
  const fimYM = ymHoje();
  let meses;
  if (S.periodo === 'ano') { const y = fimYM.slice(0, 4); meses = [...Array(12)].map((_, i) => `${y}-${p2(i + 1)}`); }
  else meses = [...Array(+S.periodo)].map((_, i) => addMeses(fimYM, i - (+S.periodo - 1)));
  const set = new Set(meses);
  const desp = S.lancamentos.filter(l => l.tipo === 'despesa' && set.has(l.data.slice(0, 7)));
  const rec = S.lancamentos.filter(l => l.tipo === 'receita' && set.has(l.data.slice(0, 7)));
  const tRec = soma(rec), tDesp = soma(desp);
  const porCat = gastoPorCategoria(desp), porCatRec = gastoPorCategoria(rec);
  const media = tDesp / meses.length;

  pos.push(() => {
    const r = meses.map(m => soma(rec.filter(l => noMes(l, m)))), d = meses.map(m => soma(desp.filter(l => noMes(l, m))));
    grafico('gRD', {
      data: { labels: meses.map(mesCurto), datasets: [
        { type: 'bar', label: 'Receitas', data: r, backgroundColor: css('--pos'), borderRadius: 6, maxBarThickness: 28, order: 2 },
        { type: 'bar', label: 'Despesas', data: d, backgroundColor: css('--neg'), borderRadius: 6, maxBarThickness: 28, order: 2 },
        { type: 'line', label: 'Resultado', data: r.map((v, i) => v - d[i]), borderColor: css('--amber'), backgroundColor: css('--amber'), tension: .3, pointRadius: 3, order: 1 },
      ] },
      options: { maintainAspectRatio: false, plugins: { legend: { labels: { boxWidth: 10, usePointStyle: true } }, tooltip: tooltipBRL }, scales: { y: { ticks: { callback: tickBRL } }, x: { grid: { display: false } } } },
    });
    if (porCat.length) grafico('gCatR', {
      type: 'doughnut',
      data: { labels: porCat.map(x => x.cat?.nome || 'Sem categoria'), datasets: [{ data: porCat.map(x => x.v), backgroundColor: porCat.map(x => x.cat?.cor || '#9aa1ad'), borderWidth: 2, borderColor: css('--surface') }] },
      options: { maintainAspectRatio: false, cutout: '62%', plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => ` ${c.label}: ${fmt(c.parsed)}` } } } },
    });
    const saldos = meses.map(m => soma(contasAtivas(), c => saldoConta(c.id, { ate: fimMes(m) })));
    grafico('gSaldo', {
      type: 'line',
      data: { labels: meses.map(mesCurto), datasets: [{ label: 'Saldo em contas', data: saldos, borderColor: css('--accent'), backgroundColor: css('--accent-soft'), fill: true, tension: .3, pointRadius: 3 }] },
      options: { maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: tooltipBRL }, scales: { y: { ticks: { callback: tickBRL } }, x: { grid: { display: false } } } },
    });
    // gastos mensais das 6 maiores categorias
    const top = porCat.slice(0, 6);
    grafico('gTop', {
      type: 'bar',
      data: { labels: meses.map(mesCurto), datasets: top.map(x => ({ label: x.cat?.nome || 'Sem categoria', data: meses.map(m => soma(desp.filter(l => noMes(l, m) && (l.categoria_id || '_') === x.id))), backgroundColor: x.cat?.cor || '#9aa1ad', borderRadius: 4, maxBarThickness: 30 })) },
      options: { maintainAspectRatio: false, plugins: { legend: { labels: { boxWidth: 10, usePointStyle: true } }, tooltip: tooltipBRL }, scales: { x: { stacked: true, grid: { display: false } }, y: { stacked: true, ticks: { callback: tickBRL } } } },
    });
  });

function vMetas() {

function vExtrato() {
  if (!S.contas.length) return `<div class="card empty">Nenhuma conta cadastrada.<br><button class="btn pri" data-act="novaConta">${ic('plus')}Cadastrar conta</button></div>`;
  if (!S.extratoConta || !byId('contas', S.extratoConta)) S.extratoConta = (contasAtivas()[0] || S.contas[0]).id;
  const c = byId('contas', S.extratoConta), ym = S.mes, ini = ym + '-01', fim = fimMes(ym), antes = diaAnterior(ini);
  const anteriorConf = saldoConta(c.id, { ate: antes }), anteriorProj = saldoConta(c.id, { ate: antes, pendentes: true });
  const lista = S.lancamentos.filter(l => noMes(l, ym) && efeitoConta(l, c.id) !== 0)
    .sort((a, b) => a.data !== b.data ? (a.data < b.data ? -1 : 1) : (a.criado_em < b.criado_em ? -1 : 1));
  let corrente = anteriorProj, ent = 0, sai = 0;
  const linhas = lista.map(l => {
    const e = efeitoConta(l, c.id); corrente += e; if (e > 0) ent += e; else sai += e;
    const cat = l.tipo === 'transferencia' ? 'Transferência' : l.tipo === 'pagamento_fatura' ? 'Pagamento de fatura' : nomeCat(l.categoria_id);
    return `<tr class="clickable ${l.pago ? '' : 'it'}" data-act="editLanc" data-id="${l.id}">
      <td class="num" style="white-space:nowrap">${dataBR(l.data).slice(0, 5)}</td>
      <td><b class="t">${esc(l.descricao)}</b>${tagSerie(l)}${l.pago ? '' : ' <span class="chip warn">pendente</span>'}<div class="s muted hide-m" style="font-size:12px">${esc(cat)}${l.tipo === 'transferencia' ? ' · ' + esc(ondeTexto(l)) : ''}${l.criado_por ? ' · ' + esc(l.criado_por) : ''}</div></td>
      <td class="r num ${e < 0 ? 'neg' : 'pos'}" style="white-space:nowrap">${e < 0 ? '−' : '+'}${fmt(Math.abs(e))}</td>
      <td class="r num hide-m ${corrente < 0 ? 'neg' : ''}" style="white-space:nowrap">${fmt(corrente)}</td></tr>`;
  });
  const finalConf = saldoConta(c.id, { ate: fim }), finalProj = saldoConta(c.id, { ate: fim, pendentes: true });
  return `
  <div class="tabs">${S.contas.filter(x => !x.arquivada || x.id === c.id).map(x => `<button class="tab ${x.id === c.id ? 'on' : ''}" data-act="selExtrato" data-id="${x.id}">${esc(x.nome)}</button>`).join('')}

    <div class="card kpi"><div class="lbl">Saldo anterior</div><div class="val num ${anteriorConf < 0 ? 'neg' : ''}">${fmt(anteriorConf)}</div><div class="foot">em ${dataBR(antes)}</div></div>
    <div class="card kpi"><div class="lbl">Entradas</div><div class="val num pos">${fmt(ent)}</div></div>
    <div class="card kpi"><div class="lbl">Saídas</div><div class="val num neg">${fmt(Math.abs(sai))}</div></div>
    <div class="card kpi"><div class="lbl">Saldo final</div><div class="val num ${finalConf < 0 ? 'neg' : ''}">${fmt(finalConf)}</div><div class="foot">projetado ${fmt(finalProj)}</div></div>
  </div>
  <div class="card"><h3>Extrato · ${esc(c.nome)} <span class="sub" style="text-transform:capitalize">${nomeMes(ym)}</span></h3>
    ${lista.length ? `<div style="overflow-x:auto"><table>
      <thead><tr><th>Data</th><th>Descrição</th><th class="r">Valor</th><th class="r hide-m">Saldo</th></tr></thead>
      <tbody><tr><td></td><td class="muted">Saldo anterior${anteriorProj !== anteriorConf ? ' (com pendências)' : ''}</td><td></td><td class="r num hide-m">${fmt(anteriorProj)}</td></tr>${linhas.join('')}</tbody>

}

function modal({ titulo, corpo, ok = 'Salvar', extra = '', onSubmit, onOpen }) {
  fecharModal();
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `<form class="modal" novalidate><header><h2>${esc(titulo)}</h2><button type="button" class="icon-btn" data-close aria-label="Fechar">${ic('x')}</button></header>
    <div class="body">${corpo}<div class="err-msg hidden" id="mErr"></div></div>
    <footer>${extra}<button type="button" class="btn" data-close>Cancelar</button><button type="submit" class="btn pri">${esc(ok)}</button></footer></form>`;
  document.body.appendChild(ov);
  const form = ov.querySelector('form');
  ov.addEventListener('mousedown', e => { if (e.target === ov) fecharModal(); });
  ov.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', fecharModal));
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const btn = form.querySelector('button[type=submit]');
    const err = form.querySelector('#mErr'); err.classList.add('hidden');
    try {
      btn.disabled = true;
      const msg = await onSubmit(form);
      if (typeof msg === 'string') { err.textContent = msg; err.classList.remove('hidden'); btn.disabled = false; return; }
      fecharModal();
    } catch (ex) { btn.disabled = false; console.error(ex); }
  });
  onOpen?.(form);
  const first = form.querySelector('[autofocus]') || form.querySelector('input:not([type=hidden]):not([type=checkbox]),select');
  if (first && window.matchMedia('(min-width:861px)').matches) first.focus();
  return form;
}
function fecharModal() { $$('.overlay').forEach(o => o.remove()); }
function escolha(titulo, texto, opcoes) {
  return new Promise(res => {
    fecharModal();
    const ov = document.createElement('div');
    ov.className = 'overlay';
    ov.innerHTML = `<div class="modal" style="max-width:420px"><header><h2>${esc(titulo)}</h2></header><div class="body"><p>${texto}</p></div>
      <footer>${opcoes.map((o, i) => `<button class="btn ${o.cls || ''}" data-i="${i}">${esc(o.t)}</button>`).join('')}</footer></div>`;
    document.body.appendChild(ov);
    ov.addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (b) { ov.remove(); res(opcoes[+b.dataset.i].v); } else if (e.target === ov) { ov.remove(); res(null); } });
  });
}

    ${l?.grupo_id ? `<p class="muted" style="font-size:12px">Este lançamento faz parte de uma série${l.total_parcelas > 1 ? ` (parcela ${l.parcela} de ${l.total_parcelas})` : ''}. Alterações valem só para ele.</p>` : ''}
`;

  modal({
    titulo: novo ? 'Novo lançamento' : 'Editar lançamento', corpo,
    extra: novo ? '' : `<button type="button" class="btn danger left" id="btnDel">Excluir</button>`,
    onOpen: form => {
      const sync = () => {
        const t = form.elements.tipo.value;
        const onde = form.elements.onde.value;
        const transf = t === 'transferencia', cartao = !transf && onde.startsWith('cartao:');
        form.querySelectorAll('.seg button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
        form.querySelectorAll('[data-show]').forEach(el => {
          const s = el.dataset.show;
          const vis = s === 'transf' ? transf : s === 'nao-transf' ? !transf : s === 'cartao' ? cartao : s === 'conta' ? (!transf && !cartao) : s === 'conta-ou-transf' ? !cartao : true;
          el.style.display = vis ? '' : 'none';
        });
        const grp = form.querySelector('[data-show-grp]');
        grp.disabled = t !== 'despesa';
        if (t !== 'despesa' && form.elements.onde.value.startsWith('cartao:')) { const o = form.elements.onde.querySelector('option:not([disabled])'); if (o) form.elements.onde.value = o.value; }
        const catSel = form.elements.categoria_id, atual = catSel.value || l?.categoria_id || '';
        if (catSel.dataset.tipo !== t) {
          catSel.innerHTML = `<option value="">Sem categoria</option>` + S.categorias.filter(c => c.tipo === t).sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR')).map(c => `<option value="${c.id}" ${c.id === atual ? 'selected' : ''}>${esc(c.nome)}</option>`).join('');
          catSel.dataset.tipo = t;
        }
        $('#fPagoTxt', form).textContent = t === 'receita' ? 'Recebido' : t === 'transferencia' ? 'Realizada' : 'Pago';
        if (cartao) {
          const c = byId('cartoes', form.elements.onde.value.slice(7)), d = form.elements.data.value;
          if (c && d) { const fy = faturaYM(c, d); $('#fFatInfo', form).innerHTML = `Entra na fatura de <b style="text-transform:capitalize">${nomeMes(fy)}</b> (vence ${dataBR(dataNoMes(fy, c.dia_vencimento))}).`; }
        }
        if (form.elements.repetir) $('#fVezesBox', form).style.display = form.elements.repetir.value === 'm' ? '' : 'none';
      };
      form.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => { if (!b.disabled) { form.elements.tipo.value = b.dataset.t; sync(); } }));
      form.addEventListener('change', sync);
      form.elements.descricao.addEventListener('change', () => {
        // sugere categoria a partir de lançamentos anteriores com a mesma descrição
        const ant = [...S.lancamentos].reverse().find(x => x.descricao.toLowerCase() === form.elements.descricao.value.trim().toLowerCase() && x.tipo === form.elements.tipo.value);
        if (ant && !form.elements.categoria_id.value && ant.categoria_id) form.elements.categoria_id.value = ant.categoria_id;
      });
      sync();
      $('#btnDel', form)?.addEventListener('click', () => apagarLanc(l));
    },
    onSubmit: async form => {
      const tipo = v(form, 'tipo');
      const valor = parseValor(v(form, 'valor'));
      const descricao = v(form, 'descricao').trim();
      const data = v(form, 'data');
      if (!(valor > 0)) return 'Informe um valor maior que zero.';
      if (!descricao) return 'Informe uma descrição.';
      if (!data) return 'Informe a data.';
      const base = { tipo, valor, descricao, data, observacao: v(form, 'observacao').trim() || null, criado_por: v(form, 'pessoa').trim() || null, categoria_id: null, conta_id: null, conta_destino_id: null, cartao_id: null, fatura_mes: null };
      if (tipo === 'transferencia') {
        base.conta_id = v(form, 'de'); base.conta_destino_id = v(form, 'para');
        if (!base.conta_id || base.conta_id === base.conta_destino_id) return 'Escolha duas contas diferentes.';
        base.pago = form.elements.pago.checked;
      } else {
        base.categoria_id = v(form, 'categoria_id') || null;
        const onde = v(form, 'onde');
        if (!onde) return 'Escolha a conta ou o cartão.';
        if (onde.startsWith('cartao:')) {
          base.cartao_id = onde.slice(7); base.pago = true;
          base.fatura_mes = faturaYM(byId('cartoes', base.cartao_id), data) + '-01';
        } else { base.conta_id = onde.slice(6); base.pago = form.elements.pago.checked; }
        lsSet('nc_ultimaOnde', onde);
      }
      if (!novo) { await salvar('lancamentos', base, l.id, 'Lançamento atualizado'); return recarregarERender(['lancamentos']); }
      let linhas = [{ ...base }];
      const parcelas = base.cartao_id ? Math.max(1, Math.min(60, parseInt(v(form, 'parcelas')) || 1)) : 1;
      const vezes = !base.cartao_id && tipo !== 'transferencia' && v(form, 'repetir') === 'm' ? Math.max(2, Math.min(120, parseInt(v(form, 'vezes')) || 2)) : 1;
      if (parcelas > 1) {
        const grupo = uuid(), cents = Math.round(valor * 100), parte = Math.floor(cents / parcelas), fy = base.fatura_mes.slice(0, 7);
        linhas = [...Array(parcelas)].map((_, i) => ({ ...base, grupo_id: grupo, parcela: i + 1, total_parcelas: parcelas,
          valor: (i === parcelas - 1 ? cents - parte * (parcelas - 1) : parte) / 100,
          data: addMesesData(data, i), fatura_mes: addMeses(fy, i) + '-01' }));
      } else if (vezes > 1) {
        const grupo = uuid();
        linhas = [...Array(vezes)].map((_, i) => ({ ...base, grupo_id: grupo, data: addMesesData(data, i), pago: i === 0 ? base.pago : false }));
      }
      await op(sb.from('lancamentos').insert(linhas), linhas.length > 1 ? `${linhas.length} lançamentos criados` : 'Lançamento salvo');
      await recarregarERender(['lancamentos']);
    },
  });
}
async function apagarLanc(l) {
  let ids = [l.id];
  if (l.grupo_id) {
    const grupo = S.lancamentos.filter(x => x.grupo_id === l.grupo_id);
    if (grupo.length > 1) {
      const proximos = grupo.filter(x => x.data >= l.data);
      const r = await escolha('Excluir lançamento', `“${esc(l.descricao)}” faz parte de uma série de ${grupo.length} lançamentos. O que deseja excluir?`, [
        { t: 'Cancelar', v: null }, { t: 'Só este', v: 'um' }, { t: `Este e os próximos (${proximos.length})`, v: 'prox' }, { t: `Todos (${grupo.length})`, v: 'todos', cls: 'danger' },
      ]);
      if (!r) return;
      if (r === 'prox') ids = proximos.map(x => x.id);
      if (r === 'todos') ids = grupo.map(x => x.id);
    } else if (!await confirmar(l)) return;
  } else if (!await confirmar(l)) return;
  fecharModal();
  await excluir('lancamentos', ids, ids.length > 1 ? `${ids.length} lançamentos excluídos` : 'Lançamento excluído');
  await recarregarERender(['lancamentos']);
}
const confirmar = l => escolha('Excluir lançamento', `Excluir “${esc(l.descricao)}” de ${fmt(l.valor)}?`, [{ t: 'Cancelar', v: false }, { t: 'Excluir', v: true, cls: 'danger' }]);

/* ---------- orçamento ---------- */
async function salvarOrc(input) {
  const catId = input.dataset.orc, mes = S.mes + '-01';
  const atual = S.orcamentos.find(o => o.categoria_id === catId && o.mes.slice(0, 7) === S.mes);
  const txt = input.value.trim();
  if (!txt) { if (atual) { await excluir('orcamentos', atual.id); await recarregarERender(['orcamentos']); } return; }
  const val = parseValor(txt);
  if (isNaN(val) || val < 0) { toast('Valor inválido', true); return; }
  if (atual && num(atual.valor) === val) return;
  if (atual) await op(sb.from('orcamentos').update({ valor: val }).eq('id', atual.id), 'Orçamento salvo');
  else await op(sb.from('orcamentos').insert({ categoria_id: catId, mes, valor: val }), 'Orçamento salvo');
  await recarregarERender(['orcamentos']);
}
async function copiarOrc() {
  const ant = addMeses(S.mes, -1);
  const origem = S.orcamentos.filter(o => o.mes.slice(0, 7) === ant);
  const existentes = new Set(S.orcamentos.filter(o => o.mes.slice(0, 7) === S.mes).map(o => o.categoria_id));
  const novos = origem.filter(o => !existentes.has(o.categoria_id)).map(o => ({ categoria_id: o.categoria_id, mes: S.mes + '-01', valor: o.valor }));
  if (!novos.length) return toast('Todas as categorias já têm limite neste mês.');
  await op(sb.from('orcamentos').insert(novos), `${novos.length} limite(s) copiado(s)`);
  await recarregarERender(['orcamentos']);
}

/* ---------- exportação ---------- */
function exportarCSV() {
  const linhas = [['Data', 'Tipo', 'Descrição', 'Categoria', 'Conta/Cartão', 'Fatura', 'Valor', 'Pago', 'Parcela', 'Observação', 'Lançado por']];
  [...S.lancamentos].sort((a, b) => a.data < b.data ? -1 : 1).forEach(l => linhas.push([
    dataBR(l.data), l.tipo, l.descricao, l.tipo === 'despesa' || l.tipo === 'receita' ? nomeCat(l.categoria_id) : '', ondeTexto(l),
    l.fatura_mes ? mesCurto(l.fatura_mes.slice(0, 7)) : '', num(l.valor).toFixed(2).replace('.', ','), l.pago ? 'sim' : 'não',
    l.total_parcelas > 1 ? `${l.parcela}/${l.total_parcelas}` : '', l.observacao || '', l.criado_por || '']));
  const csv = '﻿' + linhas.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(';')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `nosso-caixa-lancamentos-${hoje()}.csv`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

/* =====================================================================
   EVENTOS
   ===================================================================== */
const ACOES = {
  menu: () => { const s = $('#side'); s.classList.add('open'); const sc = document.createElement('div'); sc.className = 'scrim'; sc.onclick = () => { s.classList.remove('open'); sc.remove(); }; document.body.appendChild(sc); },
  mes: d => { S.mes = addMeses(S.mes, +d.n); render(); },
  sync: async () => { toast('Atualizando…'); await recarregarERender(); toast('Dados atualizados'); },
  novoLanc: () => formLanc(null, S.view === 'lancamentos' && S.filtro.onde ? { onde: S.filtro.onde } : (S.mes !== ymHoje() ? { data: S.mes + '-01' } : {})),
  editLanc: d => formLanc(byId('lancamentos', d.id)),
  togglePago: async (d, el) => {
    const l = byId('lancamentos', d.id); if (!l) return;
    el.disabled = true;
    await op(sb.from('lancamentos').update({ pago: !l.pago }).eq('id', l.id), l.pago ? 'Marcado como pendente' : (l.tipo === 'receita' ? 'Marcado como recebido' : 'Marcado como pago'));
    await recarregarERender(['lancamentos']);
  },
  limparFiltro: () => { S.filtro = { busca: '', tipo: '', onde: '', cat: '', status: '' }; render(); },
  verPendentes: () => { S.filtro = { busca: '', tipo: '', onde: '', cat: '', status: 'pendente' }; },
  novaConta: () => formConta(),
  editConta: d => formConta(byId('contas', d.id)),
  toggleArq: () => { S.contaArquivadas = !S.contaArquivadas; render(); },
  novaTransf: () => { if (contasAtivas().length < 2) return toast('Cadastre pelo menos duas contas para transferir.', true); formLanc(null, { tipo: 'transferencia' }); },
  novoCartao: () => formCartao(),
  editCartao: d => formCartao(byId('cartoes', d.id)),
  selCartao: d => { S.cartaoSel = d.id; render(); },
  fatNav: d => { S.faturaSel[d.id] = d.ym; render(); },
  verFatura: d => { S.cartaoSel = d.id; S.faturaSel[d.id] = d.ym; irPara('cartoes'); },
  novaCompra: d => formLanc(null, { tipo: 'despesa', onde: 'cartao:' + d.id }),
  pagarFatura: d => { if (!S.contas.length) return toast('Cadastre a conta que paga a fatura.', true); formPagamento(byId('cartoes', d.id), d.ym); },
  copiarOrc: () => copiarOrc(),
  periodo: d => { S.periodo = d.v; render(); },
  novaMeta: () => formMeta(),
  editMeta: d => formMeta(byId('metas', d.id)),
  aporte: d => formAporte(byId('metas', d.id), +d.s),
  novaCat: d => formCat(null, d.t),
  editCat: d => formCat(byId('categorias', d.id)),
  exportCSV: () => exportarCSV(),
  grupo: (d, el) => { el.classList.toggle('fechado'); lsSet('nc_grp_' + d.g, el.classList.contains('fechado') ? '0' : '1'); },
  verExtrato: d => { S.extratoConta = d.id; irPara('extrato'); },
  selExtrato: d => { S.extratoConta = d.id; render(); },
  copiarLink: async () => { const t = linkConfig(); try { await navigator.clipboard.writeText(t); } catch { const i = $('#linkCfg'); i.select(); document.execCommand('copy'); } toast('Link copiado'); },
  compartLink: () => navigator.share({ title: 'Nosso Caixa', text: 'Abra este link para configurar o Nosso Caixa neste aparelho:', url: linkConfig() }).catch(() => {}),
  trocarConexao: async () => {
    if (!await escolha('Trocar conexão', 'Desconectar este aparelho do banco atual? Os dados continuam salvos no Supabase.', [{ t: 'Cancelar', v: false }, { t: 'Desconectar', v: true, cls: 'danger' }])) return;
    try { await sb.auth.signOut(); } catch {}
    apagarConfig(); telaSetup(1);
  },
  sair: async () => { await sb.auth.signOut(); S.lancamentos = []; telaLogin(); },
};
document.addEventListener('click', e => {
  const nav = e.target.closest('[data-nav]');
  if (nav) { e.preventDefault(); irPara(nav.dataset.nav); return; }
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  if (el.tagName === 'A' && el.dataset.act !== 'verPendentes') e.preventDefault();
  const fn = ACOES[el.dataset.act];
  if (fn) Promise.resolve(fn(el.dataset, el, e)).catch(err => console.error(err));
});
document.addEventListener('input', e => {
  const f = e.target.dataset?.filtro;
  if (f === 'busca') { S.filtro.busca = e.target.value; clearTimeout(window._bt); window._bt = setTimeout(() => { const pos = e.target.selectionStart; render(); const i = $('[data-filtro=busca]'); if (i) { i.focus(); i.setSelectionRange(pos, pos); } }, 250); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset?.filtro && t.dataset.filtro !== 'busca') { S.filtro[t.dataset.filtro] = t.value; render(); }
  if (t.dataset?.orc) salvarOrc(t).catch(() => {});
  if (t.id === 'quem') { lsSet('nc_quem', t.value.trim()); $('#sideFoot').textContent = t.value.trim() ? `Neste aparelho: ${t.value.trim()}` : ''; toast('Salvo neste aparelho'); }
  if (t.id === 'tema') { lsSet('nc_tema', t.value); aplicarTema(); render(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') fecharModal();
  if (e.target.dataset?.orc && e.key === 'Enter') e.target.blur();
});
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h && h !== S.view && VIEWS[h] && $('#view')) irPara(h); });
// quando o app volta a ficar visível (ex.: a esposa lançou algo no celular), atualiza os dados
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && $('#view') && !$('.overlay') && Date.now() - S.carregadoEm > 60000) recarregarERender();
});
function aplicarTema() { const t = lsGet('nc_tema'); if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }

/* =====================================================================
   INÍCIO
   ===================================================================== */
(async function () {
  aplicarTema();
  if (!window.supabase) { $('#root').innerHTML = '<div class="loading">Não foi possível carregar a biblioteca do Supabase. Verifique a internet.</div>'; return; }
  const cfg = lerConfig();
  if (!cfg) return telaSetup(1);
  conectar(cfg);
  const { data: { session } } = await sb.auth.getSession();
  if (session) iniciarApp(); else telaLogin();
})();
</script>
</body>
</html>
