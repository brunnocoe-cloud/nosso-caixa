<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1cc7a0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nosso Caixa">
<title>Nosso Caixa</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231cc7a0'/%3E%3Ctext x='32' y='42' font-family='Arial' font-weight='700' font-size='26' fill='white' text-anchor='middle'%3ENC%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#f0f0f0; --surface:#ffffff; --surface-2:#f7f7f7; --hover:#f2f5f4; --ink:#3c4043; --ink-2:#202124; --muted:#80868b; --line:#e4e4e4;
  --accent:#1cc7a0; --accent-ink:#ffffff; --accent-soft:#e1f7f1; --accent-dark:#12a584;
  --link:#1e88e5; --link-soft:#e3f0fc;
  --pos:#16a77d; --neg:#ec407a; --warn:#f2a100; --late:#e53935; --conc:#1e88e5;
  --chip:#eef0f1; --chip-ink:#5f6368;
  --shadow:0 1px 2px rgba(0,0,0,.08),0 1px 3px rgba(0,0,0,.06);
  --shadow-2:0 6px 24px rgba(0,0,0,.18);
  --r:14px; --side:264px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16181b; --surface:#202327; --surface-2:#1a1d20; --hover:#262a2f; --ink:#dcdfe3; --ink-2:#f1f3f4; --muted:#9aa0a6; --line:#30343a;
    --accent:#1fd1a8; --accent-ink:#0b1f19; --accent-soft:#163a31; --accent-dark:#26e0b6;
    --link:#64b5f6; --link-soft:#1b2c3d;
    --pos:#3ccf9d; --neg:#f06292; --warn:#ffb74d; --late:#ef5350; --conc:#64b5f6;
    --chip:#2b2f35; --chip-ink:#c4c7cc;
    --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-2:0 8px 30px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#16181b; --surface:#202327; --surface-2:#1a1d20; --hover:#262a2f; --ink:#dcdfe3; --ink-2:#f1f3f4; --muted:#9aa0a6; --line:#30343a;
  --accent:#1fd1a8; --accent-ink:#0b1f19; --accent-soft:#163a31; --accent-dark:#26e0b6;
  --link:#64b5f6; --link-soft:#1b2c3d;
  --pos:#3ccf9d; --neg:#f06292; --warn:#ffb74d; --late:#ef5350; --conc:#64b5f6;
  --chip:#2b2f35; --chip-ink:#c4c7cc;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-2:0 8px 30px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hidden{display:none!important}
.pos{color:var(--pos)} .neg{color:var(--neg)} .muted{color:var(--muted)} .warn{color:var(--warn)} .b{font-weight:700}
body.ocultar .num.v{filter:blur(6px);user-select:none}

/* ===== layout ===== */
.app{min-height:100vh}
.topbar{position:sticky;top:0;z-index:40;height:60px;display:flex;align-items:center;gap:6px;padding:0 16px;background:var(--bg)}
.topbar h1{font-size:18px;font-weight:400;color:var(--muted);margin:0 0 0 8px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.userbtn{display:flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;cursor:pointer;font-weight:500}
.icon-btn{width:40px;height:40px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--muted);flex:none}
.icon-btn:hover{background:rgba(0,0,0,.06);color:var(--ink)}
.icon-btn.sm{width:32px;height:32px}
.icon-btn.sm svg.i{width:18px;height:18px}
.icon-btn.on{color:var(--accent-dark);background:var(--accent-soft)}
.drawer{position:fixed;left:0;top:0;bottom:0;width:var(--side);background:var(--surface);z-index:60;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow-2);display:flex;flex-direction:column;overflow-y:auto}
.drawer.open{transform:none}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:55}
@media (min-width:1100px){
  .app.fixo .drawer{transform:none;box-shadow:none;border-right:1px solid var(--line)}
  .app.fixo .content,.app.fixo .topbar{margin-left:var(--side)}
  .app.fixo .scrim{display:none}
}
.drawer .brand{display:flex;align-items:center;gap:10px;padding:16px 18px;font-weight:700;font-size:18px;color:var(--ink-2)}
.logo{width:32px;height:32px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:14px;letter-spacing:-.02em}
.nav{padding:4px 8px;flex:1}
.nav a,.nav .grp{display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:24px;color:var(--ink);font-weight:500;text-decoration:none;cursor:pointer;width:100%;border:0;background:transparent;text-align:left;font-size:14px}
.nav a svg.i,.nav .grp svg.i{color:var(--muted)}
.nav a:hover,.nav .grp:hover{background:var(--hover);text-decoration:none}
.nav a.on{background:var(--accent-soft);color:var(--accent-dark)}
.nav a.on svg.i{color:var(--accent-dark)}
.nav .grp .car{margin-left:auto;width:18px;height:18px;transition:transform .2s}
.nav .grp.fechado .car{transform:rotate(-90deg)}
.nav .grp.fechado + .subnav{display:none}
.nav .subnav a{padding-left:24px}
.drawer .temas{display:flex;justify-content:center;gap:6px;padding:10px;border-top:1px solid var(--line)}
.drawer .ver{font-size:11px;color:var(--muted);text-align:center;padding:0 0 12px}
.content{padding:0 16px 110px;max-width:1500px}

/* ===== cartões / painéis ===== */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.card+.card{margin-top:14px}
.card-h{display:flex;align-items:center;gap:6px;padding:14px 16px 10px;min-height:52px}
.card-h h3{margin:0;font-size:16px;font-weight:400;color:var(--ink);flex:1;min-width:0}
.card-h .acts{display:flex;align-items:center;gap:2px;margin-left:auto}
.card-b{padding:0 16px 14px}
.card-b.flush{padding:0}
.card.recolhido .card-b,.card.recolhido .card-f{display:none}
.card.recolhido .car{transform:rotate(180deg)}
.card .car{transition:transform .2s}
.card-f{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--surface-2);border-top:1px solid var(--line);border-radius:0 0 var(--r) var(--r);font-weight:700}
.dash{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
.dash .col>.card{margin-bottom:14px}
.dash>.col,.pg>*{min-width:0}
.pg{display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px;align-items:start}
.pg .lado>.card{margin-bottom:14px}
.pg .lado{position:sticky;top:64px;max-height:calc(100vh - 70px);overflow-y:auto;padding-bottom:4px;scrollbar-width:thin}
.pg.solo{grid-template-columns:minmax(0,1fr)}

/* tabela compacta */
.t{width:100%;border-collapse:collapse}
.t th{font-size:12px;font-weight:500;color:var(--muted);text-align:right;padding:6px 8px;white-space:nowrap}
.t th:first-child,.t td:first-child{text-align:left}
.t td{padding:7px 8px;text-align:right;border-top:1px solid var(--line)}
.t tr.tot td{font-weight:700;background:var(--surface-2)}
.t tr.sub td{color:var(--muted);font-size:13px}
.t tr.sub td:first-child{padding-left:24px}
.t td.l,.t th.l{text-align:left}
.t tr.click{cursor:pointer}
.t tr.click:hover td{background:var(--hover)}
.mesnav{display:flex;align-items:center;justify-content:space-between;padding:8px}
.mesnav .lbl{font-size:15px;font-weight:500;text-transform:capitalize;text-align:center;flex:1}
.sel{display:flex;align-items:center;gap:8px;padding:10px 12px 0}
.sel select{flex:1;min-width:0;border:0;border-bottom:1px solid var(--line);background:transparent;padding:8px 2px;font-size:15px;font-weight:500}
.ck{width:18px;height:18px;accent-color:var(--accent);vertical-align:-4px;margin:0 8px 0 0}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:14px}
.kv.tot{font-weight:700;border-top:1px solid var(--line);margin-top:4px;padding-top:8px}
.kv.ind{padding-left:14px;color:var(--muted);font-size:13px}
.sec-t{font-size:12px;color:var(--muted);text-align:center;margin:10px 0 4px;letter-spacing:.02em}
.acoes-l{display:flex;justify-content:space-around;gap:8px;padding:8px 0 2px}
.lnk{background:none;border:0;color:var(--link);cursor:pointer;font-weight:500;padding:6px 4px}
.lnk:hover{text-decoration:underline}
.lnk.acc{color:var(--accent-dark)}

/* barra de ferramentas da lista */
.tb{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:60px;background:var(--surface);z-index:5;border-radius:var(--r) var(--r) 0 0}
.tb .lbl{font-weight:500;margin-right:4px}
.fchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:4px 12px 4px 8px;cursor:pointer;font-size:13px;color:var(--chip-ink)}
.fchip i{width:12px;height:12px;border-radius:50%;border:2px solid var(--muted);display:inline-block}
.fchip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.fchip.on i{border-color:var(--accent);background:var(--accent)}
.tb .busca{flex:1 1 160px;min-width:120px;border:0;border-bottom:1px solid var(--line);background:transparent;padding:6px 2px}
.tb .sp{flex:1}
.tb select{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:5px 8px;font-size:13px}

/* linhas de lançamento */
.lrow{display:flex;align-items:center;gap:12px;padding:9px 12px;border-bottom:1px solid var(--line);min-height:56px}
.lrow:hover{background:var(--hover)}
.lrow .dt{width:62px;flex:none;font-size:13px;color:var(--muted)}
.lrow .dt.hoje{color:var(--warn);font-weight:500}
.lrow .mid{flex:1;min-width:0;cursor:pointer}
.lrow .ds{font-size:14px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px;align-items:center}
.lrow .val{font-weight:500;min-width:92px;text-align:right}
.lrow .sal{min-width:96px;text-align:right;color:var(--muted);font-size:13px}
.lrow .rep{color:var(--muted);display:inline-flex}
.lrow .rep svg.i{width:16px;height:16px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:1px 7px;border-radius:4px;background:var(--chip);color:var(--chip-ink);white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.chip.tag{border-radius:10px;color:#fff}
.chip .dot{width:7px;height:7px;border-radius:50%;flex:none}
.chip.cc svg.i{width:13px;height:13px}
.st{width:30px;height:30px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;flex:none;position:relative}
.st svg.i{width:22px;height:22px}
.st.pend{color:var(--warn)}
.st.atr{color:var(--late)}
.st.conf{color:var(--pos)}
.st.conc{color:var(--conc)}
.st .dias{position:absolute;left:-2px;bottom:-2px;background:var(--late);color:#fff;font-size:9px;font-weight:700;border-radius:8px;padding:0 4px;line-height:13px}
.st:hover{background:var(--hover)}
.dsep{display:flex;justify-content:space-between;padding:8px 12px;background:var(--surface-2);border-bottom:1px solid var(--line);font-size:13px;font-weight:500}
.dsep.ini{color:var(--muted)}
.empty{padding:34px 16px;text-align:center;color:var(--muted)}
.empty .ico{font-size:28px;margin-bottom:6px;color:var(--muted)}
.empty .btn{margin-top:12px}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;background:transparent;color:var(--accent-dark);padding:8px 14px;border-radius:8px;font-weight:500;cursor:pointer;text-transform:none;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--accent-soft)}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{background:var(--accent-dark)}
.btn.out{border:1px solid var(--line);color:var(--ink);background:var(--surface)}
.btn.danger{color:var(--late)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn svg.i{width:18px;height:18px}

/* FAB */
.fab-w{position:fixed;right:22px;bottom:22px;z-index:45;display:flex;flex-direction:column-reverse;align-items:center;gap:12px}
.fab{width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.25);display:grid;place-items:center;cursor:pointer;transition:transform .2s}
.fab svg.i{width:28px;height:28px;stroke-width:2.2}
.fab-w.open .fab.main{transform:rotate(45deg)}
.fab.mini{width:42px;height:42px;background:var(--accent-dark);opacity:0;transform:scale(.4) translateY(20px);pointer-events:none;transition:.18s;position:relative}
.fab.mini svg.i{width:20px;height:20px}
.fab-w.open .fab.mini{opacity:1;transform:none;pointer-events:auto}
.fab.mini .tip{position:absolute;right:52px;top:50%;transform:translateY(-50%);background:rgba(50,50,50,.9);color:#fff;font-size:12px;padding:4px 8px;border-radius:4px;white-space:nowrap}
.fab.mini.rec{background:var(--pos)} .fab.mini.desp{background:var(--neg)}
@media (hover:hover){.fab-w:hover .fab.mini{opacity:1;transform:none;pointer-events:auto}.fab-w:hover .fab.main{transform:rotate(45deg)}}

/* menu de contexto */
.cmenu{position:fixed;z-index:90;background:var(--surface);border-radius:8px;box-shadow:var(--shadow-2);padding:6px 0;min-width:200px}
.cmenu button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;padding:9px 16px;text-align:left;cursor:pointer;font-size:14px}
.cmenu button:hover{background:var(--hover)}
.cmenu button svg.i{width:18px;height:18px;color:var(--muted)}
.cmenu button.danger{color:var(--late)}
.cmenu hr{border:0;border-top:1px solid var(--line);margin:4px 0}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:grid;place-items:center;z-index:70;padding:16px;animation:fade .15s}
.modal{background:var(--surface);border-radius:12px;width:100%;max-width:560px;max-height:94vh;overflow:auto;box-shadow:var(--shadow-2);display:flex;flex-direction:column}
.modal.wide{max-width:820px}
.modal header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 4px;gap:10px}
.modal header h2{margin:0;font-size:19px;font-weight:400}
.modal .body{padding:10px 20px 6px;overflow:auto}
.modal footer{display:flex;gap:8px;align-items:center;padding:12px 16px;background:var(--surface-2);border-top:1px solid var(--line);flex-wrap:wrap}
.modal footer .sp{flex:1}
@keyframes fade{from{opacity:0}to{opacity:1}}
.tipo-sel{border:0;background:transparent;font-size:19px;font-weight:400;padding:2px 4px;cursor:pointer;color:var(--ink-2)}
.f{display:flex;flex-direction:column;gap:2px;margin-bottom:14px;min-width:0}
.f label{font-size:12px;color:var(--muted)}
.f label.req::after{content:" *"}
.f input,.f select,.f textarea{border:0;border-bottom:1px solid var(--line);background:transparent;padding:7px 2px;width:100%;border-radius:0;font-size:15px}
.f textarea{resize:vertical;min-height:38px}
.f input:focus,.f select:focus,.f textarea:focus{outline:0;border-bottom:2px solid var(--accent);padding-bottom:6px}
.f .cnt{font-size:11px;color:var(--muted);text-align:right}
.f input[type=color]{height:38px;padding:2px;border:0}
.fr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.fr.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.fr .s2{grid-column:span 2}
.valwrap{display:flex;align-items:flex-end;gap:4px}
.valwrap input{font-size:20px!important;font-weight:500}
.hint{font-size:12px;color:var(--muted);margin:-8px 0 12px}
.hint.err{color:var(--late)}
.ftog{width:38px;height:38px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.ftog:hover{background:var(--hover)}
.ftog.on.conf{color:var(--pos)}
.ftog.on.conc{color:var(--conc)}
.ftog svg.i{width:24px;height:24px}
.salvar-g{display:inline-flex;border-radius:8px;overflow:hidden}
.salvar-g .btn{border-radius:0}
.salvar-g .btn+.btn{border-left:1px solid rgba(255,255,255,.4)}
.tagsel{display:flex;flex-wrap:wrap;gap:6px;padding:6px 0;border-bottom:1px solid var(--line)}
.tagsel label{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:3px 10px;border-radius:12px;border:1px solid var(--line);cursor:pointer;color:var(--chip-ink)}
.tagsel input{display:none}
.tagsel input:checked+span{font-weight:700}
.tagsel label:has(input:checked){background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.anx{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 10px}
.anx .chip{font-size:12px;padding:3px 8px;cursor:pointer}
.det-row{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) 34px;gap:10px;align-items:end}
.err-msg{color:var(--late);font-weight:500;font-size:13px;margin-bottom:10px}
.inline{display:flex;align-items:center;gap:8px;margin-bottom:12px;cursor:pointer}
.inline input{width:18px;height:18px;accent-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#323232;color:#fff;padding:12px 20px;border-radius:6px;z-index:95;box-shadow:var(--shadow-2);max-width:90vw}
.toast.err{background:var(--late)}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:4px}
.chart-box{position:relative;height:240px}
.legend-l .row{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:13px}
.legend-l .row .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.tabs{display:flex;justify-content:center;gap:4px;margin:0 0 12px}
.tab{border:0;background:transparent;padding:10px 18px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent}
.tab.on{color:var(--accent-dark);border-bottom-color:var(--accent)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.grid3 .card{margin:0}
.mini-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.rel-g h4{font-size:13px;color:var(--muted);font-weight:500;margin:18px 4px 8px;text-transform:uppercase;letter-spacing:.04em}
.rel-item{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;cursor:pointer;border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
.rel-item:hover{background:var(--hover)}
.rel-item .ic{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent-dark);display:grid;place-items:center;flex:none}
.rel-item b{display:block;font-weight:500;margin-bottom:2px;color:var(--ink-2)}
.rel-item span{font-size:13px;color:var(--muted)}
.lista-cad .item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.lista-cad .item:hover{background:var(--hover)}
.lista-cad .item.sub{padding-left:40px}
.lista-cad .item.off{opacity:.5}

<script type="text/plain" id="sqlSchema">
-- =====================================================================
--  NOSSO CAIXA · Esquema do banco (Supabase / PostgreSQL) · versão 3
--  Como usar: Supabase > SQL Editor > New query > cole tudo > Run
--  Pode ser executado de novo sem problema (não apaga dados).
-- =====================================================================

-- ---------- CONTAS ----------
create table if not exists public.contas (
  id            uuid primary key default gen_random_uuid(),
  user_id       uuid not null default auth.uid() references auth.users(id) on delete cascade,
  nome          text not null,
  tipo          text not null default 'corrente',
  saldo_inicial numeric(14,2) not null default 0,
  cor           text not null default '#2f7d6d',
  arquivada     boolean not null default false,
  criado_em     timestamptz not null default now()
);
alter table public.contas add column if not exists considerar_saldo boolean not null default true;
alter table public.contas add column if not exists fechado_ate date;
alter table public.contas drop constraint if exists contas_tipo_check;
alter table public.contas add constraint contas_tipo_check
  check (tipo in ('corrente','poupanca','carteira','investimento','ativos','outra'));

-- ---------- CARTÕES DE CRÉDITO ----------
create table if not exists public.cartoes (
  id             uuid primary key default gen_random_uuid(),
  user_id        uuid not null default auth.uid() references auth.users(id) on delete cascade,
  nome           text not null,
  limite         numeric(14,2) not null default 0,
  dia_fechamento int  not null check (dia_fechamento between 1 and 31),
  dia_vencimento int  not null check (dia_vencimento between 1 and 31),
  conta_id       uuid references public.contas(id) on delete set null,
  cor            text not null default '#6b4fa3',
  arquivado      boolean not null default false,
  criado_em      timestamptz not null default now()
);
alter table public.cartoes add column if not exists titulares text[] not null default '{}';
alter table public.cartoes add column if not exists fechado_ate date;
alter table public.cartoes add column if not exists faturas_fechadas text[] not null default '{}';

-- ---------- CATEGORIAS (com subcategorias) ----------
create table if not exists public.categorias (
  id        uuid primary key default gen_random_uuid(),
  user_id   uuid not null default auth.uid() references auth.users(id) on delete cascade,
  nome      text not null,
  tipo      text not null check (tipo in ('receita','despesa')),
  cor       text not null default '#888888',
  criado_em timestamptz not null default now()
);
alter table public.categorias add column if not exists parent_id uuid references public.categorias(id) on delete cascade;
alter table public.categorias add column if not exists ativa boolean not null default true;

-- ---------- TAGS ----------
create table if not exists public.tags (
  id        uuid primary key default gen_random_uuid(),
  user_id   uuid not null default auth.uid() references auth.users(id) on delete cascade,
  nome      text not null,
  cor       text not null default '#5c6bc0',
  criado_em timestamptz not null default now()
);

-- ---------- LANÇAMENTOS ----------
create table if not exists public.lancamentos (
  id               uuid primary key default gen_random_uuid(),
  user_id          uuid not null default auth.uid() references auth.users(id) on delete cascade,
  tipo             text not null check (tipo in ('receita','despesa','transferencia','pagamento_fatura')),
  descricao        text not null,
  valor            numeric(14,2) not null check (valor >= 0),
  data             date not null,
  pago             boolean not null default true,
  categoria_id     uuid references public.categorias(id) on delete set null,
  conta_id         uuid references public.contas(id) on delete cascade,
  conta_destino_id uuid references public.contas(id) on delete cascade,
  cartao_id        uuid references public.cartoes(id) on delete cascade,
  fatura_mes       date,
  grupo_id         uuid,
  parcela          int,
  total_parcelas   int,
  observacao       text,
  criado_por       text,
  criado_em        timestamptz not null default now()
);
alter table public.lancamentos add column if not exists conciliado boolean not null default false;
alter table public.lancamentos add column if not exists tags uuid[] not null default '{}';
alter table public.lancamentos add column if not exists anexos jsonb not null default '[]';
alter table public.lancamentos add column if not exists serie text;      -- 'parcelada' | 'fixa' | 'fixa_fim' | 'detalhado'
alter table public.lancamentos add column if not exists ext_id text;     -- identificador do extrato importado (OFX)
create index if not exists lanc_user_data   on public.lancamentos(user_id, data);
create index if not exists lanc_user_fatura on public.lancamentos(user_id, cartao_id, fatura_mes);
create index if not exists lanc_grupo       on public.lancamentos(grupo_id);

-- ---------- ORÇAMENTO (metas de despesa por categoria e mês) ----------
create table if not exists public.orcamentos (
  id           uuid primary key default gen_random_uuid(),
  user_id      uuid not null default auth.uid() references auth.users(id) on delete cascade,
  categoria_id uuid not null references public.categorias(id) on delete cascade,
  mes          date not null,
  valor        numeric(14,2) not null check (valor >= 0),
  unique (user_id, categoria_id, mes)
);

-- ---------- METAS DE ECONOMIA ----------
create table if not exists public.metas (
  id          uuid primary key default gen_random_uuid(),
  user_id     uuid not null default auth.uid() references auth.users(id) on delete cascade,
  nome        text not null,
  valor_alvo  numeric(14,2) not null check (valor_alvo > 0),
  valor_atual numeric(14,2) not null default 0,
  data_alvo   date,
  cor         text not null default '#c8873a',
  criado_em   timestamptz not null default now()
);
alter table public.metas add column if not exists conta_id uuid references public.contas(id) on delete set null;

-- ---------- REGRAS DE PREENCHIMENTO ----------
create table if not exists public.regras (
  id           uuid primary key default gen_random_uuid(),
  user_id      uuid not null default auth.uid() references auth.users(id) on delete cascade,
  tipo         text not null check (tipo in ('receita','despesa')),
  descricao    text not null,
  palavras     text,
  conta_id     uuid references public.contas(id) on delete cascade,
  cartao_id    uuid references public.cartoes(id) on delete cascade,
  titular      text,
  categoria_id uuid references public.categorias(id) on delete set null,
  tags         uuid[] not null default '{}',
  criado_em    timestamptz not null default now()
);

-- ---------- PREFERÊNCIAS (recursos habilitados, fechamento global) ----------
create table if not exists public.preferencias (
  user_id uuid primary key default auth.uid() references auth.users(id) on delete cascade,
  dados   jsonb not null default '{}'
);

-- =====================================================================
--  SEGURANÇA (Row Level Security): cada login só enxerga os próprios dados
-- =====================================================================
do $$
declare t text;
begin
  foreach t in array array['contas','cartoes','categorias','tags','lancamentos','orcamentos','metas','regras','preferencias'] loop
    execute format('alter table public.%I enable row level security', t);
    execute format('drop policy if exists "dono_%s" on public.%I', t, t);
    execute format(
      'create policy "dono_%s" on public.%I for all to authenticated
         using (user_id = auth.uid()) with check (user_id = auth.uid())', t, t);
  end loop;
end $$;

-- =====================================================================
--  DOCUMENTOS (anexos): pasta privada por usuário no Storage
-- =====================================================================
insert into storage.buckets (id, name, public, file_size_limit)
values ('documentos', 'documentos', false, 10485760)
on conflict (id) do nothing;

drop policy if exists "nc_docs_ler"     on storage.objects;
drop policy if exists "nc_docs_enviar"  on storage.objects;
drop policy if exists "nc_docs_alterar" on storage.objects;
drop policy if exists "nc_docs_apagar"  on storage.objects;
create policy "nc_docs_ler" on storage.objects for select to authenticated
  using (bucket_id = 'documentos' and (storage.foldername(name))[1] = auth.uid()::text);
create policy "nc_docs_enviar" on storage.objects for insert to authenticated
  with check (bucket_id = 'documentos' and (storage.foldername(name))[1] = auth.uid()::text);
create policy "nc_docs_alterar" on storage.objects for update to authenticated
  using (bucket_id = 'documentos' and (storage.foldername(name))[1] = auth.uid()::text);
create policy "nc_docs_apagar" on storage.objects for delete to authenticated
  using (bucket_id = 'documentos' and (storage.foldername(name))[1] = auth.uid()::text);

-- =====================================================================
--  TRAVA: só é possível criar UM login (o do casal).
--  (Para remover a trava: drop trigger limitar_um_usuario on auth.users;)
-- =====================================================================
create or replace function public.limitar_um_usuario() returns trigger
language plpgsql security definer set search_path = public as $$
begin
  if (select count(*) from auth.users) >= 1 then
    raise exception 'NOSSO_CAIXA_JA_TEM_ACESSO';
  end if;
  return new;
end $$;
drop trigger if exists limitar_um_usuario on auth.users;
create trigger limitar_um_usuario before insert on auth.users
  for each row execute function public.limitar_um_usuario();
-- =====================================================================
--  NOSSO CAIXA v4 · OPEN FINANCE (Pluggy / Meu Pluggy)
--  Pode rodar quantas vezes quiser (não apaga nada).
-- =====================================================================
create table if not exists public.pluggy_contas (
  id            text primary key,                 -- id da conta na Pluggy
  user_id       uuid not null default auth.uid() references auth.users(id) on delete cascade,
  item_id       text not null,
  nome          text,
  tipo          text,                             -- BANK | CREDIT
  numero        text,
  conta_id      uuid references public.contas(id)  on delete set null,
  cartao_id     uuid references public.cartoes(id) on delete set null,
  ativo         boolean not null default true,
  atualizado_em timestamptz
);
create table if not exists public.pluggy_execucoes (
  id          uuid primary key default gen_random_uuid(),
  user_id     uuid not null default auth.uid() references auth.users(id) on delete cascade,
  inicio      timestamptz not null default now(),
  fim         timestamptz,
  origem      text,
  novos       int default 0,
  conciliados int default 0,
  ignorados   int default 0,
  erro        text
);
create index if not exists lanc_user_ext on public.lancamentos(user_id, ext_id);
do $$ declare t text; begin
  foreach t in array array['pluggy_contas','pluggy_execucoes'] loop
    execute format('alter table public.%I enable row level security', t);
    execute format('drop policy if exists "dono_%s" on public.%I', t, t);
    execute format('create policy "dono_%s" on public.%I for all to authenticated
       using (user_id = auth.uid()) with check (user_id = auth.uid())', t, t);
  end loop;
end $$;

-- ---------- agendamento automático (a cada 6 horas) ----------
create extension if not exists pg_net;
create extension if not exists pg_cron;
create schema if not exists privado;
revoke all on schema privado from public, anon, authenticated;
create table if not exists privado.config (chave text primary key, valor text not null);
insert into privado.config values ('cron', encode(extensions.gen_random_bytes(24), 'hex')) on conflict (chave) do nothing;

create or replace function public.nc_cron_ok(t text) returns boolean
language sql security definer set search_path = public as $$
  select exists (select 1 from privado.config where chave = 'cron' and valor = t)
$$;
revoke all on function public.nc_cron_ok(text) from public, anon, authenticated;
grant execute on function public.nc_cron_ok(text) to service_role;

create or replace function public.nc_disparar_pluggy() returns void
language plpgsql security definer set search_path = public as $$
begin
  perform net.http_post(
    url     := 'https://cuhrhtkwfuwgsvsdrkng.supabase.co/functions/v1/pluggy-sync',
    headers := jsonb_build_object('Content-Type','application/json',
                 'x-nc-cron', (select valor from privado.config where chave = 'cron')),
    body    := '{"acao":"sincronizar"}'::jsonb,
    timeout_milliseconds := 120000);
end $$;
revoke all on function public.nc_disparar_pluggy() from public, anon, authenticated;

select cron.unschedule('nosso-caixa-pluggy') where exists (select 1 from cron.job where jobname = 'nosso-caixa-pluggy');
select cron.schedule('nosso-caixa-pluggy', '15 9,15,21,3 * * *', 'select public.nc_disparar_pluggy()');

-- ---------- cofre da chave da Pluggy (só a função do servidor lê) ----------
create or replace function public.nc_pluggy_cred() returns jsonb
language sql security definer set search_path = public as $$
  select jsonb_build_object('id', (select valor from privado.config where chave = 'pluggy_id'),
                            'secret', (select valor from privado.config where chave = 'pluggy_secret'))
$$;
create or replace function public.nc_pluggy_cred_salvar(cid text, csecret text) returns void
language sql security definer set search_path = public as $$
  insert into privado.config values ('pluggy_id', cid), ('pluggy_secret', csecret)
  on conflict (chave) do update set valor = excluded.valor
$$;
revoke all on function public.nc_pluggy_cred() from public, anon, authenticated;
revoke all on function public.nc_pluggy_cred_salvar(text, text) from public, anon, authenticated;
grant execute on function public.nc_pluggy_cred() to service_role;
grant execute on function public.nc_pluggy_cred_salvar(text, text) to service_role;

/* =====================================================================
   CONFIGURAÇÃO (OPCIONAL)
   Não precisa mexer aqui: no primeiro acesso o próprio site pede a URL e a
   chave do Supabase. Se preferir deixar fixo no arquivo, cole abaixo.
   ===================================================================== */
const SUPABASE_URL = 'https://cuhrhtkwfuwgsvsdrkng.supabase.co';
const SUPABASE_KEY = 'sb_publishable_SgHwvT7fCqkUul5IuPB8ow_RbzKNwlk';
/* ===================================================================== */
function lerConfig() {
  if (!SUPABASE_URL.startsWith('COLE_') && !SUPABASE_KEY.startsWith('COLE_')) return { u: SUPABASE_URL, k: SUPABASE_KEY, fixo: true };
  try { const c = JSON.parse(localStorage.getItem('nc_cfg') || 'null'); if (c?.u && c?.k) return c; } catch {}
  return null;
}
function gravarConfig(u, k) { try { localStorage.setItem('nc_cfg', JSON.stringify({ u, k })); } catch {} }
function apagarConfig() { try { localStorage.removeItem('nc_cfg'); } catch {} }
// link de configuração para o outro aparelho: ...#cfg=<base64>
(function () {
  const m = location.hash.match(/^#cfg=(.+)$/);
  if (!m) return;
  try { const c = JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(m[1]))))); if (c.u && c.k) gravarConfig(c.u, c.k); } catch {}
  history.replaceState(null, '', location.pathname + location.search);
})();

/* =====================================================================
   NÚCLEO: utilitários, estado, dados e regras de negócio

function arvoreCategorias(tipo, soAtivas = false, extraId = null) {

// efeito de um lançamento no saldo de uma conta (compras no cartão não mexem na conta)
function efeitoConta(l, contaId) {
  const v = num(l.valor);
  if (l.cartao_id && l.tipo !== 'pagamento_fatura') return 0;
  if (l.tipo === 'receita' && l.conta_id === contaId) return v;
  if (l.tipo === 'despesa' && l.conta_id === contaId) return -v;
  if (l.tipo === 'pagamento_fatura' && l.conta_id === contaId) return -v;
  if (l.tipo === 'transferencia') {
    if (l.conta_id === contaId) return -v;
    if (l.conta_destino_id === contaId) return v;
  }
  return 0;
}
// opts.ate: até a data (inclusive) · opts.pendentes: inclui não confirmados · opts.antes: antes da data
function saldoConta(contaId, opts = {}) {
  const c = byId('contas', contaId);
  let s = num(c?.saldo_inicial);
  for (const l of S.lancamentos) {
    if (!l.pago && !opts.pendentes) continue;
    if (opts.ate && l.data > opts.ate) continue;
    if (opts.antes && l.data >= opts.antes) continue;
    s += efeitoConta(l, contaId);
  }
  return r2(s);
}

/* ---------------- cartões e faturas ---------------- */
function faturaYMcalc(cartao, ds) {
  const ym = ds.slice(0, 7), d = +ds.slice(8, 10);
  const [y, m] = ym.split('-').map(Number);
  const fech = Math.min(cartao.dia_fechamento, diasNoMes(y, m));
  const fechYM = d >= fech ? addMeses(ym, 1) : ym;
  return cartao.dia_vencimento > cartao.dia_fechamento ? fechYM : addMeses(fechYM, 1);
}
// fatura em que cai uma compra (pula faturas fechadas manualmente)
function faturaYM(cartao, ds) {
  let fy = faturaYMcalc(cartao, ds);
  const fech = cartao.faturas_fechadas || [];
  for (let i = 0; i < 24 && fech.includes(fy); i++) fy = addMeses(fy, 1);
  return fy;
}

const datasFatura = (c, fym) => {
  const fechYM = c.dia_vencimento > c.dia_fechamento ? fym : addMeses(fym, -1);
  return { fechamento: dataNoMes(fechYM, c.dia_fechamento), vencimento: dataNoMes(fym, c.dia_vencimento) };
};
let _fatCache = new Map();
function faturaInfo(c, fym) {
  const key = c.id + fym + S.carregadoEm + (S.prefs.faturas_base || '');
  if (_fatCache.has(key)) return _fatCache.get(key);
  const doCartao = S.lancamentos.filter(l => l.cartao_id === c.id);
  const itens = doCartao.filter(l => (l.tipo === 'despesa' || l.tipo === 'receita') && fatMes(l) === fym)
    .sort((a, b) => a.data < b.data ? -1 : a.data > b.data ? 1 : 0);
  const pagamentos = doCartao.filter(l => l.tipo === 'pagamento_fatura' && fatMes(l) === fym);
  const despesas = soma(itens.filter(l => l.tipo === 'despesa')), creditos = soma(itens.filter(l => l.tipo === 'receita'));
  const total = r2(despesas - creditos);
  const pago = soma(pagamentos.filter(p => p.pago));
  // saldo anterior = o que ficou sem pagar na fatura anterior
  const meses = [...new Set(doCartao.map(fatMes).filter(Boolean))].sort();
  let saldoAnterior = 0;
  // faturas até a "base" (histórico importado) são consideradas quitadas, como no Meu Dinheiro
  const base = S.prefs.faturas_base || '';
  if (meses.length && meses[0] < fym) {
    const prev = addMeses(fym, -1);
    saldoAnterior = prev >= meses[0] && prev > base ? faturaInfo(c, prev).aPagar : 0;
  }
  const aPagar = r2(Math.max(0, saldoAnterior + total - pago));
  const { fechamento, vencimento } = datasFatura(c, fym);

  const fechadaManual = (c.faturas_fechadas || []).includes(fym);
  let status;
  if (total <= 0 && saldoAnterior <= 0) status = pago > 0 ? 'paga' : 'vazia';
  else if (aPagar <= 0.004) status = 'paga';
  else if (h > vencimento) status = 'vencida';
  else if (h >= fechamento || fechadaManual) status = 'fechada';
  else status = 'aberta';
  const conciliado = soma(itens.filter(l => l.conciliado), l => l.tipo === 'despesa' ? l.valor : -l.valor);
  const fixas = soma(itens.filter(l => (l.serie || '').startsWith('fixa')), l => l.tipo === 'despesa' ? l.valor : -l.valor);
  const res = { itens, pagamentos, despesas, creditos, total, pago, saldoAnterior, aPagar, fechamento, vencimento, status, fechadaManual, conciliado, naoConciliado: r2(total - conciliado), fixas };
  _fatCache.set(key, res);
  return res;
}
// limite usado = valor a pagar da fatura atual (com o que ficou das anteriores) + parcelas futuras
function usoCartao(c) {
  const cur = faturaYM(c, hoje());
  const futuras = S.lancamentos.filter(l => l.cartao_id === c.id && l.serie === 'parcelada' && fatMes(l) > cur);
  const usado = r2(Math.max(0, faturaInfo(c, cur).aPagar + soma(futuras.filter(l => l.tipo === 'despesa')) - soma(futuras.filter(l => l.tipo === 'receita'))));
  return { usado, disponivel: r2(num(c.limite) - usado) };
}

function regraPara(desc, tipo) {
  const d = semAcento(desc);
  if (!d) return null;
  const rs = S.regras.filter(r => r.tipo === tipo);
  return rs.find(r => semAcento(r.descricao) === d)
    || rs.find(r => (r.palavras || '').split(/[,;\n]/).map(semAcento).filter(Boolean).some(p => d.includes(p)))

    || null;
}

// séries "Fixa": mantém lançamentos gerados até 24 meses à frente, respeitando o intervalo
// da série (mensal, trimestral, anual…) e só continuando as que ainda estão ativas
const difMeses = (a, b) => (+b.slice(0, 4) - +a.slice(0, 4)) * 12 + (+b.slice(5, 7) - +a.slice(5, 7));
async function estenderFixas() {
  const grupos = new Map();
  for (const l of S.lancamentos) if (l.grupo_id && (l.serie === 'fixa' || l.serie === 'fixa_fim')) {
    if (!grupos.has(l.grupo_id)) grupos.set(l.grupo_id, []);
    grupos.get(l.grupo_id).push(l);
  }
  const limite = addMesesData(hoje(), 24), novos = [];
  for (const ls of grupos.values()) {
    if (ls.some(l => l.serie === 'fixa_fim')) continue;
    ls.sort((a, b) => a.data < b.data ? -1 : 1);
    // intervalo mais comum entre ocorrências (padrão: 1 mês)
    const gaps = {}; for (let i = 1; i < ls.length; i++) { const g = difMeses(ls[i - 1].data, ls[i].data); if (g > 0) gaps[g] = (gaps[g] || 0) + 1; }
    const gap = +(Object.entries(gaps).sort((a, b) => b[1] - a[1])[0]?.[0] || 1);
    const ult = ls[ls.length - 1];
    // série encerrada: a última ocorrência ficou bem antes do horizonte de 24 meses
    if (difMeses(ult.data, limite) > gap + 1) continue;
    const base = { ...ult }; ['id', 'criado_em', 'user_id'].forEach(x => delete base[x]);
    for (let k = 1; k < 200; k++) {
      const nd = addMesesData(ult.data, k * gap);
      if (nd > limite) break;
      const n = { ...base, data: nd, pago: false, conciliado: false, anexos: [], ext_id: null };
      if (base.cartao_id) { const c = byId('cartoes', base.cartao_id); if (c) n.fatura_mes = faturaYM(c, nd) + '-01'; }
      novos.push(n);
    }
  }
  if (novos.length) { await inserirMuitos('lancamentos', novos); S.lancamentos = await fetchAll('lancamentos'); S.carregadoEm = Date.now(); _fatCache = new Map(); }
}

function modal({ titulo, tituloHTML, corpo, ok = 'Salvar', extra = '', rodape, onSubmit, onOpen, largo = false }) {
  fecharModal();
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `<form class="modal ${largo ? 'wide' : ''}" novalidate><header>${tituloHTML || `<h2>${esc(titulo)}</h2>`}<button type="button" class="icon-btn" data-close aria-label="Fechar">${ic('x')}</button></header>
    <div class="body">${corpo}<div class="err-msg hidden" id="mErr"></div></div>
    <footer>${rodape ?? `${extra}<span class="sp"></span><button type="button" class="btn" data-close>Cancelar</button><button type="submit" class="btn pri">${esc(ok)}</button>`}</footer></form>`;
  document.body.appendChild(ov);
  const form = ov.querySelector('form');
  ov.addEventListener('mousedown', e => { if (e.target === ov) fecharModal(); });
  ov.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', fecharModal));
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const sub = e.submitter;
    const btns = form.querySelectorAll('footer button');
    const err = form.querySelector('#mErr'); err.classList.add('hidden');
    try {
      btns.forEach(b => b.disabled = true);
      const msg = await onSubmit(form, sub);
      if (typeof msg === 'string') { err.textContent = msg; err.classList.remove('hidden'); err.scrollIntoView({ block: 'nearest' }); btns.forEach(b => b.disabled = false); return; }
      if (msg !== false) fecharModal(); else btns.forEach(b => b.disabled = false);
    } catch (ex) { btns.forEach(b => b.disabled = false); console.error(ex); }
  });
  onOpen?.(form);
  const first = form.querySelector('[autofocus]') || form.querySelector('.body input:not([type=hidden]):not([type=checkbox]):not([type=file]),.body select');
  if (first && matchMedia('(min-width:700px)').matches) first.focus();
  return form;
}

function barraMeta(nome, real, meta, cor, economia = false) {

/* =====================================================================

function filtroBusca(lista) {

}
const buscaInput = () => `<input class="busca" type="search" placeholder="Buscar" data-filtro="busca" value="${esc(S.busca)}">`;
function vLancamentos() {

  const res = resultadosCaixa(doMes, ids);

/* =====================================================================
   FLUXO DE CAIXA
   ===================================================================== */
function periodoFluxo() {
  if (!S.fluxoIni) {
    const h = hoje();
    if (S.fluxoModo === 'mes') S.fluxoIni = iniMes(h.slice(0, 7));
    else { const dw = (new Date(h + 'T12:00').getDay() + 6) % 7; S.fluxoIni = addDias(h, -dw); }
  }
  const ini = S.fluxoIni;
  const fim = S.fluxoModo === 'mes' ? fimMes(ini.slice(0, 7)) : S.fluxoModo === '30' ? addDias(ini, 29) : addDias(ini, 6);
  return { ini, fim };
}
function vFluxo(pos) {
  const { ini, fim } = periodoFluxo();
  const ids = contasFiltradas().map(c => c.id);
  const anterior = soma(ids, id => saldoConta(id, { antes: ini, pendentes: true }));
  const mov = new Map();
  for (const l of S.lancamentos) if (noPeriodo(l, ini, fim) && ehCaixa(l)) {
    const e = ids.reduce((a, id) => a + efeitoConta(l, id), 0);
    if (!e) continue;
    const m = mov.get(l.data) || { ent: 0, sai: 0 };
    e > 0 ? m.ent += e : m.sai += e; mov.set(l.data, m);
  }
  const dias = []; let s = anterior;
  const serie = [];
  for (let d = ini; d <= fim; d = addDias(d, 1)) {
    const m = mov.get(d); if (m) { s += m.ent + m.sai; dias.push({ d, ...m, res: r2(m.ent + m.sai), saldo: r2(s) }); }
    serie.push({ d, saldo: r2(s) });
  }
  const tEnt = soma(dias, x => x.ent), tSai = soma(dias, x => x.sai);
  const lbl = d => `${d.slice(8)} ${MES3[+d.slice(5, 7) - 1]}`;
  pos.push(() => {
    grafico('gFx1', { type: 'line', data: { labels: serie.map(x => lbl(x.d)), datasets: [{ label: 'Saldo', data: serie.map(x => x.saldo), borderColor: css('--link'), backgroundColor: css('--link-soft'), fill: true, tension: .25, pointRadius: serie.length > 40 ? 0 : 3, stepped: false }] },
      options: { maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: tooltipBRL }, scales: { y: { ticks: { callback: tickBRL } }, x: { grid: { display: false } } } } });
    grafico('gFx2', { type: 'bar', data: { labels: dias.map(x => lbl(x.d)), datasets: [
      { label: 'Entradas', data: dias.map(x => x.ent), backgroundColor: css('--link'), borderRadius: 3, maxBarThickness: 30 },
      { label: 'Saídas', data: dias.map(x => x.sai), backgroundColor: css('--neg'), borderRadius: 3, maxBarThickness: 30 },
      { label: 'Resultado', type: 'line', data: dias.map(x => x.res), borderColor: css('--warn'), backgroundColor: css('--warn'), pointRadius: 3 }] },
      options: { maintainAspectRatio: false, plugins: { legend: legendaB, tooltip: tooltipBRL }, scales: { y: { ticks: { callback: tickBRL } }, x: { grid: { display: false } } } } });
  });
  _csvAtual = { linhas: [['Data', 'Entradas', 'Saídas', 'Resultado', 'Saldo'], ['Saldo anterior', '', '', '', fmtN(anterior)], ...dias.map(x => [dataBR(x.d), fmtN(x.ent), fmtN(x.sai), fmtN(x.res), fmtN(x.saldo)])], nome: 'fluxo' };
  const saldosFim = contasFiltradas().map(c => ({ c, v: saldoConta(c.id, { ate: fim, pendentes: true }) }));
  const rotulo = S.fluxoModo === 'mes' ? nomeMes(ini.slice(0, 7)) : `${lbl(ini)} - ${lbl(fim)}`;
  return `<div class="pg"><div class="lado">
      <div class="card"><div class="mesnav"><button class="icon-btn" data-act="fluxoNav" data-n="-1">${ic('left')}</button><span class="lbl">${rotulo}</span><button class="icon-btn" data-act="fluxoNav" data-n="1">${ic('right')}</button><button class="icon-btn sm" data-act="fluxoHoje" title="Hoje">${ic('clock')}</button></div>
        <div class="card-b"><div class="f" style="margin:0"><label>Período</label><select data-act="fluxoModo">${[['semana', 'Semana'], ['30', 'Próximos 30 dias'], ['mes', 'Mês']].map(([k, n]) => `<option value="${k}" ${S.fluxoModo === k ? 'selected' : ''}>${n}</option>`).join('')}</select></div></div></div>
      <div class="card">${cardH(`Saldo em ${lbl(fim)}`)}<div class="card-b flush"><table class="t">${saldosFim.map(x => `<tr><td class="l"><span class="dot" style="background:${esc(x.c.cor)};margin-right:6px"></span>${esc(x.c.nome)}</td><td>${vH(x.v)}</td></tr>`).join('')}
        <tr class="tot"><td class="l">Total</td><td>${vH(soma(saldosFim, x => x.v))}</td></tr></table></div></div>
      ${painelSaldos(fim, 'Contas consideradas')}</div>
    <div><div class="card">${cardH('Fluxo de caixa', acoesLista())}<div class="card-b"><div class="chart-box"><canvas id="gFx1"></canvas></div></div>
      <div style="overflow-x:auto"><table class="t"><tr><th class="l">Data</th><th>Entradas (R$)</th><th>Saídas (R$)</th><th>Resultado (R$)</th><th>Saldo (R$)</th></tr>
      <tr><td class="l muted">Saldo anterior</td><td></td><td></td><td></td><td>${vH(anterior)}</td></tr>
      ${dias.map(x => `<tr class="click" data-act="fluxoDia" data-d="${x.d}"><td class="l">${dataBR(x.d)}</td><td>${vH(x.ent)}</td><td>${vH(x.sai)}</td><td>${vH(x.res)}</td><td>${vH(x.saldo)}</td></tr>`).join('')}
      <tr class="tot"><td class="l">Total</td><td>${vH(tEnt)}</td><td>${vH(tSai)}</td><td>${vH(tEnt + tSai)}</td><td>${vH(s)}</td></tr></table></div></div>
      <div class="card">${cardH('Resultado de caixa')}<div class="card-b"><div class="chart-box"><canvas id="gFx2"></canvas></div></div></div></div></div>`;
}

/* =====================================================================

function vExtrato() {
  if (!S.contas.length) return vazio('Nenhuma conta cadastrada.', `<button class="btn pri" data-act="novaConta">Cadastrar conta</button>`);
  if (!S.extratoConta || !byId('contas', S.extratoConta)) S.extratoConta = (contasAtivas()[0] || S.contas[0]).id;
  const c = byId('contas', S.extratoConta), ym = S.mes, ini = iniMes(ym), fim = fimMes(ym);
  const doMes = S.lancamentos.filter(l => noMes(l, ym) && efeitoConta(l, c.id) !== 0);
  const sit = pend => {
    const ls = doMes.filter(l => pend || l.pago);
    const r = resultadosCaixa(ls, [c.id]);
    const ant = saldoConta(c.id, { antes: ini, pendentes: pend });
    return { ant, ...r, fin: r2(ant + r.res) };
  };
  const a = sit(false), b = sit(true);
  const lista = filtroBusca(doMes.filter(l => passaStatus(l, S.status))).sort((x, y) => x.data !== y.data ? (x.data < y.data ? -1 : 1) : (x.criado_em < y.criado_em ? -1 : 1));
  _csvAtual = { linhas: csvLanc(lista), nome: 'extrato-' + c.nome };
  const comSaldo = !S.status.size && !S.busca;
  let s = b.ant, out = '', diaAtual = null;
  lista.forEach((l, i) => {
    s += efeitoConta(l, c.id);
    out += linhaL(l, { ids: [c.id], semConta: true });
    const prox = lista[i + 1];
    if (comSaldo && (!prox || prox.data !== l.data)) out += `<div class="dsep"><span style="text-transform:capitalize">${diaSemana(l.data)}, ${dataBR(l.data)}</span>${vH(r2(s))}</div>`;
  });
  const row = (n, k) => `<tr><td class="l">${n}</td><td>${vH(a[k])}</td><td>${vH(b[k])}</td></tr>`;
  return `<div class="pg"><div class="lado">
      <div class="card"><div class="sel"><select data-act="selExtrato" aria-label="Conta">${S.contas.filter(x => !x.arquivada || x.id === c.id).map(x => `<option value="${x.id}" ${x.id === c.id ? 'selected' : ''}>${esc(x.nome)}</option>`).join('')}</select>
        <button class="icon-btn sm" data-act="editConta" data-id="${c.id}" title="Editar conta">${ic('edit')}</button></div>
        <div class="mesnav"><button class="icon-btn" data-act="mes" data-n="-1">${ic('left')}</button><span class="lbl">${nomeMes(ym)}</span><button class="icon-btn" data-act="mes" data-n="1">${ic('right')}</button><button class="icon-btn sm" data-act="mesHoje" title="Mês atual">${ic('clock')}</button></div></div>
      <div class="card">${cardH('Situação confirmada/projetada (R$)')}<div class="card-b flush"><table class="t"><tr><th class="l"></th><th>Confirmada</th><th>Projetada</th></tr>
        ${row('Saldo anterior', 'ant')}${row('Receitas', 'rec')}${row('Transferências de entrada', 'te')}${row('Despesas', 'desp')}${row('Transferências de saída', 'ts')}${row('Resultado', 'res')}
        <tr class="tot"><td class="l">Saldo final</td><td>${vH(a.fin)}</td><td>${vH(b.fin)}</td></tr></table></div></div></div>
    <div class="card"><div class="tb">${chipsStatus(['pendente', 'agendado', 'confirmado', 'conciliado'])}${buscaInput()}<button class="icon-btn sm" data-act="ajustarSaldo" data-id="${c.id}" title="Ajustar saldo">${ic('ajsal')}</button>${acoesLista()}</div>
      ${comSaldo ? `<div class="dsep ini"><span>${dataBR(addDias(ini, -1)).slice(0, 5)} · Saldo anterior</span>${vH(b.ant)}</div>` : ''}

}

/* =====================================================================

   ===================================================================== */
function vCartoes(pos) {
  if (!S.cartoes.length) return vazio('Nenhum cartão de crédito cadastrado.', `<button class="btn pri" data-act="novoCartao">Cadastrar cartão</button>`);
  if (!S.cartaoSel || !byId('cartoes', S.cartaoSel)) S.cartaoSel = (cartoesAtivos()[0] || S.cartoes[0]).id;
  const c = byId('cartoes', S.cartaoSel);
  const fym = S.faturaSel[c.id] || faturaYM(c, hoje());
  const f = faturaInfo(c, fym), u = usoCartao(c);
  const F = S.cartaoFiltro;
  let itens = f.itens.filter(l => !F.conc.size || F.conc.has(l.conciliado ? 'sim' : 'nao'));
  if (F.titular) itens = itens.filter(l => (l.criado_por || '') === (F.titular === '_' ? '' : F.titular));
  itens = filtroBusca(itens);
  if (F.ordem === 'valor') itens = [...itens].sort((a, b) => num(b.valor) - num(a.valor));
  _csvAtual = { linhas: csvLanc(itens.concat(f.pagamentos)), nome: `fatura-${c.nome}-${fym}` };
  const parcFuturas = S.lancamentos.filter(l => l.cartao_id === c.id && l.serie === 'parcelada' && fatMes(l) > fym && l.tipo === 'despesa');
  const titulares = [...new Set([...(c.titulares || []), ...f.itens.map(l => l.criado_por).filter(Boolean)])];
  const porTit = new Map();
  for (const l of f.itens) { const k = l.criado_por || 'Sem titular'; porTit.set(k, (porTit.get(k) || 0) + (l.tipo === 'despesa' ? -1 : 1) * num(l.valor)); }
  const catItens = porCategoria(itens.filter(l => l.tipo === 'despesa'));
  if (F.grafico && catItens.length) pos.push(() => donut('gFatCat', catItens));
  // lista agrupada por data (como "Total em 17/11")
  let lista = '';
  if (F.ordem === 'valor') lista = itens.map(l => linhaL(l, { cartao: true })).join('');
  else {
    const grupos = new Map();
    for (const l of itens) { if (!grupos.has(l.data)) grupos.set(l.data, []); grupos.get(l.data).push(l); }
    for (const [d, ls] of grupos) lista += `<div class="dsep"><span>Total em ${dataBR(d).slice(0, 5)}</span>${vH(-soma(ls, l => l.tipo === 'despesa' ? l.valor : -l.valor))}</div>` + ls.map(l => linhaL(l, { cartao: true, semData: true })).join('');
  }

function linhasOrcamento(ym) {
  const ini = iniMes(ym), fim = fimMes(ym);
  const desp = despesasPer(ini, fim).concat(S.lancamentos.filter(l => l.tipo === 'receita' && l.cartao_id && noPeriodo(l, ini, fim)));
  const real = new Map();
  for (const l of desp) { const r = catRaiz(l.categoria_id); const k = r?.id || '_'; real.set(k, (real.get(k) || 0) + (l.tipo === 'despesa' ? 1 : -1) * num(l.valor)); }
  const metas = new Map(S.orcamentos.filter(o => o.mes.slice(0, 7) === ym).map(o => [catRaiz(o.categoria_id)?.id || o.categoria_id, (0) + num(o.valor)]));
  const ids = new Set([...real.keys(), ...metas.keys()]);
  return [...ids].map(id => ({ id, nome: id === '_' ? 'Sem categoria' : (catById(id)?.nome || '?'), cor: id === '_' ? '#9aa0a6' : corCat(id), meta: r2(metas.get(id) || 0), realizado: r2(real.get(id) || 0) }))
    .sort((a, b) => (b.meta ? 1 : 0) - (a.meta ? 1 : 0) || b.realizado - a.realizado);
}

  const temAnterior = S.orcamentos.some(o => o.mes.slice(0, 7) === addMeses(ym, -1));
  _csvAtual = { linhas: [['Categoria', 'Meta', 'Realizado', 'Saldo', '%'], ...linhas.map(x => [x.nome, fmtN(x.meta), fmtN(x.realizado), fmtN(x.meta - x.realizado), x.meta ? Math.round(x.realizado / x.meta * 100) + '%' : ''])], nome: 'metas-despesa-' + ym };

function formMetasDespesa() {
  const ym = S.mes;
  const atuais = new Map(S.orcamentos.filter(o => o.mes.slice(0, 7) === ym).map(o => [o.categoria_id, o]));
  const pais = arvoreCategorias('despesa', true).filter(x => x.nivel === 0).map(x => x.c);
  const media = id => { let t = 0; for (let i = 1; i <= 3; i++) { const m = addMeses(ym, -i); t += linhasOrcamento(m).find(x => x.id === id)?.realizado || 0; } return r2(t / 3); };
  modal({
    titulo: `Definir metas de despesa · ${nomeMes(ym)}`, largo: true,
    corpo: `<p class="muted" style="margin-top:0">Informe o limite de gasto de cada categoria (inclui as subcategorias). Deixe vazio para não definir meta.</p>
      <table class="t"><tr><th class="l">Categoria</th><th class="hide-m">Média 3 meses</th><th>Meta (R$)</th></tr>
      ${pais.map(c => `<tr><td class="l"><span class="dot" style="background:${esc(c.cor)};margin-right:8px"></span>${esc(c.nome)}</td><td class="hide-m muted num">${fmtN(media(c.id))}</td>

      <div class="f" style="margin-top:14px;max-width:320px"><label>Aplicar também aos meses seguintes</label><select name="rep"><option value="0">Somente ${nomeMes(ym)}</option><option value="2">Próximos 2 meses</option><option value="5">Próximos 5 meses</option><option value="11">Próximos 11 meses</option></select></div>`,
    onSubmit: async form => {
      const meses = [ym, ...[...Array(+v(form, 'rep'))].map((_, i) => addMeses(ym, i + 1))];
      const ins = [], upd = [], del = [];
      for (const c of pais) {
        const txt = v(form, 'm_' + c.id).trim(); const val = txt ? parseValor(txt) : null;
        if (txt && (isNaN(val) || val < 0)) return `Valor inválido em ${c.nome}.`;
        for (const m of meses) {
          const ex = S.orcamentos.find(o => o.categoria_id === c.id && o.mes.slice(0, 7) === m);
          if (val === null) { if (ex && m === ym) del.push(ex.id); }
          else if (ex) { if (num(ex.valor) !== val) upd.push([ex.id, val]); }
          else ins.push({ categoria_id: c.id, mes: m + '-01', valor: val });
        }
      }
      if (del.length) await excluir('orcamentos', del);
      for (const [id, val] of upd) await op(sb.from('orcamentos').update({ valor: val }).eq('id', id));
      if (ins.length) await inserirMuitos('orcamentos', ins);
      toast('Metas salvas');
      await recarregarERender(['orcamentos']);
    },
  });
}
async function copiarOrc() {
  const ym = S.mes, ant = addMeses(ym, -1);
  const existentes = new Set(S.orcamentos.filter(o => o.mes.slice(0, 7) === ym).map(o => o.categoria_id));
  const novos = S.orcamentos.filter(o => o.mes.slice(0, 7) === ant && !existentes.has(o.categoria_id)).map(o => ({ categoria_id: o.categoria_id, mes: ym + '-01', valor: o.valor }));
  if (!novos.length) return toast('Nada para copiar.');
  await inserirMuitos('orcamentos', novos, `${novos.length} meta(s) copiada(s)`);
  await recarregarERender(['orcamentos']);
}

function statusMeta(m) {
  const atual = m.conta_id && byId('contas', m.conta_id) ? saldoConta(m.conta_id, { ate: hoje() }) : num(m.valor_atual);
  const alvo = num(m.valor_alvo), falta = r2(Math.max(0, alvo - atual));

  if (m.data_alvo) { const [y1, m1] = ymHoje().split('-').map(Number), [y2, m2] = m.data_alvo.slice(0, 7).split('-').map(Number); meses = (y2 - y1) * 12 + (m2 - m1); }
  const ideal = falta <= 0 ? 0 : meses && meses > 0 ? r2(falta / meses) : falta;
  return { atual: r2(atual), alvo, falta, meses, ideal, pct: alvo ? Math.max(0, Math.min(100, atual / alvo * 100)) : 0 };
}

function aplicarPreset(p) {
  const P = S.relParams, h = ymHoje();

async function enviarArquivos(files) {
  const out = [];
  for (const f of files) {
    if (f.size > 10 * 1048576) { toast(`${f.name}: limite de 10 MB por arquivo`, true); continue; }
    const nome = f.name.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\w.\-]+/g, '_').slice(-80);

    if (error) { toast('Erro ao enviar ' + f.name + ': ' + traduzErro(error), true); continue; }
    out.push({ path, nome: f.name, tam: f.size });
  }
  return out;
}

/* =====================================================================
   IMPORTAR LANÇAMENTOS (OFX / CSV)
   ===================================================================== */
S.imp = { destino: '', inverter: false, fatura: 'auto', arquivo: '', linhas: null, csv: null };
function parseDataBR(s) {
  s = String(s || '').trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);
  if (m) { const y = m[3].length === 2 ? '20' + m[3] : m[3]; return `${y}-${p2(m[2])}-${p2(m[1])}`; }
  m = s.match(/^(\d{4})(\d{2})(\d{2})/); if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  return null;
}
function lerTexto(buf) {
  let t = new TextDecoder('utf-8').decode(buf);
  if (t.includes('�')) t = new TextDecoder('windows-1252').decode(buf);
  return t;
}
function parseOFX(t) {
  const out = [];
  const blocos = t.split(/<STMTTRN>/i).slice(1);
  const tag = (b, n) => { const m = b.match(new RegExp('<' + n + '>([^<\\r\\n]*)', 'i')); return m ? m[1].trim() : ''; };
  for (const b of blocos) {
    const data = parseDataBR(tag(b, 'DTPOSTED'));
    const valor = parseFloat(tag(b, 'TRNAMT').replace(',', '.'));
    const desc = (tag(b, 'MEMO') || tag(b, 'NAME') || 'Lançamento').replace(/\s+/g, ' ');
    if (data && isFinite(valor)) out.push({ data, desc, valor: r2(valor), ext: tag(b, 'FITID') || null });
  }
  return out;
}
function parseCSVTexto(t) {
  const linha1 = t.split(/\r?\n/).find(l => l.trim()) || '';
  const sep = [';', '\t', ','].map(s => [s, linha1.split(s).length]).sort((a, b) => b[1] - a[1])[0][0];
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < t.length; i++) {
    const ch = t[i];
    if (q) { if (ch === '"') { if (t[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === sep) { row.push(cur); cur = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && t[i + 1] === '\n') i++; row.push(cur); if (row.some(x => x.trim())) rows.push(row.map(x => x.trim())); row = []; cur = ''; }
    else cur += ch;
  }
  row.push(cur); if (row.some(x => x.trim())) rows.push(row.map(x => x.trim()));
  return rows;
}
function detectarColunas(rows) {
  const n = Math.max(...rows.map(r => r.length));
  const amostra = rows.slice(0, 40);
  const score = f => [...Array(n)].map((_, c) => amostra.filter(r => f(r[c] || '')).length);
  const sData = score(x => !!parseDataBR(x)), sVal = score(x => /^-?\s*(R\$)?\s*-?[\d.]+(,\d{1,2})?$|^-?[\d]+(\.\d{1,2})?$/.test(x.replace(/\s/g, '')) && !parseDataBR(x)), sTxt = score(x => /[a-zA-Zà-ú]{3,}/.test(x));
  const best = arr => arr.indexOf(Math.max(...arr));
  const data = best(sData), valor = best(sVal.map((s, i) => i === data ? -1 : s)), desc = best(sTxt.map((s, i) => i === data || i === valor ? -1 : s));
  const header = !parseDataBR(rows[0][data] || '');
  return { data, valor, desc, header, n };
}
function linhasDoCSV() {
  const { rows, map } = S.imp.csv;
  return rows.slice(map.header ? 1 : 0).map(r => ({ data: parseDataBR(r[map.data]), desc: (r[map.desc] || '').replace(/\s+/g, ' ') || 'Lançamento', valor: parseValor(r[map.valor]), ext: null }))
    .filter(x => x.data && isFinite(x.valor) && x.valor !== 0);
}
function prepararLinhas(brutas) {
  const [k, id] = S.imp.destino.split(':');
  const existentes = S.lancamentos.filter(l => k === 'cartao' ? l.cartao_id === id : (l.conta_id === id && !l.cartao_id));
  const chave = (d, v, ds) => `${d}|${r2(Math.abs(v))}|${semAcento(ds)}`;
  const jaTem = new Set(existentes.map(l => chave(l.data, l.valor, l.descricao)));
  const exts = new Set(existentes.map(l => l.ext_id).filter(Boolean));
  S.imp.linhas = brutas.map(b => {
    let valor = S.imp.inverter ? -b.valor : b.valor;
    const tipo = valor < 0 ? 'despesa' : 'receita';
    const regra = regraPara(b.desc, tipo);
    const ant = [...S.lancamentos].reverse().find(l => l.tipo === tipo && semAcento(l.descricao) === semAcento(b.desc) && l.categoria_id);
    const dup = (b.ext && exts.has(b.ext)) || jaTem.has(chave(b.data, valor, b.desc));
    const pagto = k === 'cartao' && tipo === 'receita' && /pagamento|pgto|pag\b/i.test(b.desc);
    return { ...b, valor, tipo, cat: regra?.categoria_id || ant?.categoria_id || '', tags: regra?.tags || [], titular: regra?.titular || '', dup, sel: !dup && !pagto, obs: pagto ? 'Pagamento de fatura (desmarcado: registre pelo botão "Lançar pagamento")' : '' };
  });
}

  let preview = '';

      ${ehCartao ? `<div class="f"><label>Fatura</label><select data-imp="fatura"><option value="auto">Calcular pela data da compra</option>${[-1, 0, 1, 2].map(i => { const fy = addMeses(faturaYM(cartao, hoje()), i); return `<option value="${fy}" ${I.fatura === fy ? 'selected' : ''}>Fatura de ${nomeMes(fy)}</option>`; }).join('')}</select></div>` : '<div></div>'}
      <div class="f"><label class="req">Arquivo (.ofx ou .csv)</label><input type="file" accept=".ofx,.qfx,.csv,.txt" data-act="impArquivo" ${I.destino ? '' : 'disabled'}></div></div>

async function lerArquivoImport(file) {
  const t = lerTexto(await file.arrayBuffer());
  S.imp.arquivo = file.name; S.imp.csv = null;
  if (/<OFX>|OFXHEADER|<STMTTRN>/i.test(t)) {
    const ls = parseOFX(t);
    if (!ls.length) return toast('Nenhum lançamento encontrado no OFX.', true);
    S.imp.brutas = ls; prepararLinhas(ls);
  } else {
    const rows = parseCSVTexto(t);
    if (rows.length < 1) return toast('Arquivo vazio ou em formato desconhecido.', true);
    S.imp.csv = { rows, map: detectarColunas(rows) };
    S.imp.brutas = linhasDoCSV(); prepararLinhas(S.imp.brutas);
  }
  render();
}

async function importarMD() {
  const M = S.md, p = M.p;
  const passo = msg => { M.fase = 'rodando'; M.msg = msg; if (S.view === 'importar') render(); };
  const norm = s => semAcento(s).replace(/\s+/g, ' ');
  // 1) contas e cartões
  passo('Criando contas e cartões…');
  const mapConta = {}, mapCartao = {};
  const TIPO = { 'CONTA CORRENTE': 'corrente', 'POUPANCA': 'poupanca', 'POUPANÇA': 'poupanca', 'INVESTIMENTO': 'ativos', 'DINHEIRO': 'carteira', 'CARTEIRA': 'carteira', 'OUTROS': 'outra' };
  const usados = new Set();
  for (const c of p.contas.filter(c => !c.cartao)) {
    let ex = S.contas.find(x => norm(x.nome) === norm(c.nome) && !usados.has(x.id));
    if (!ex) {
      const [novo] = await op(sb.from('contas').insert({ nome: c.nome, tipo: TIPO[c.tipo] || 'outra', saldo_inicial: c.saldoInicial || 0, arquivada: !c.ativo, considerar_saldo: c.bp !== false, cor: PALETA[Object.keys(mapConta).length % PALETA.length] }).select());
      ex = novo;
    }
    usados.add(ex.id); mapConta[c.id] = ex.id;
  }
  for (const c of p.contas.filter(c => c.cartao)) {
    const nomes = p.contas.filter(x => x.cartao && norm(x.nome) === norm(c.nome));
    const nome = nomes.length > 1 && nomes.indexOf(c) > 0 ? `${c.nome} (${nomes.indexOf(c) + 1})` : c.nome;
    let ex = S.cartoes.find(x => norm(x.nome) === norm(nome) && !usados.has(x.id));
    const dados = { nome, limite: c.limite || 0, dia_fechamento: c.fech || 1, dia_vencimento: c.venc || 10, conta_id: mapConta[c.contaPgto] || null, titulares: c.titulares || [], arquivado: !c.ativo };
    if (ex) await op(sb.from('cartoes').update({ ...dados, nome: ex.nome }).eq('id', ex.id));
    else { const [novo] = await op(sb.from('cartoes').insert({ ...dados, cor: PALETA[(Object.keys(mapCartao).length + 5) % PALETA.length] }).select()); ex = novo; }
    usados.add(ex.id); mapCartao[c.id] = ex.id;
  }
  // 2) categorias (casando pelo nome; cria as que faltarem)
  passo('Conferindo categorias…');
  S.categorias = await fetchAll('categorias');
  const mapCat = {};
  const acha = (tipo, nome, paiId) => S.categorias.find(x => x.tipo === tipo && norm(x.nome) === norm(nome) && (x.parent_id || null) === (paiId || null));
  const mdPais = p.categorias.filter(c => !c.pai), mdSubs = p.categorias.filter(c => c.pai);
  for (const c of mdPais) {
    let ex = acha(c.tipo, c.nome, null);
    if (!ex) { const [n] = await op(sb.from('categorias').insert({ nome: c.nome, tipo: c.tipo, ativa: c.ativa, cor: PALETA[S.categorias.length % PALETA.length] }).select()); S.categorias.push(n); ex = n; }
    mapCat[c.id] = ex.id;
  }
  for (const c of mdSubs) {
    const pai = mapCat[c.pai]; if (!pai) continue;
    let ex = acha(c.tipo, c.nome, pai);
    if (!ex) { const [n] = await op(sb.from('categorias').insert({ nome: c.nome, tipo: c.tipo, parent_id: pai, ativa: c.ativa, cor: catById(pai)?.cor || '#888' }).select()); S.categorias.push(n); ex = n; }
    mapCat[c.id] = ex.id;
  }
  // 3) lançamentos
  passo('Preparando lançamentos…');
  const jaTem = new Set(S.lancamentos.map(l => l.ext_id).filter(Boolean));
  const grupos = {}, ymAtual = ymHoje();
  // séries fixas: só continuam "vivas" se tiverem ocorrência a partir do mês atual
  const fixasVivas = new Set(p.lancamentos.filter(l => l.pa === 'fixa' && l.g && l.d.slice(0, 7) >= ymAtual).map(l => l.g));
  const linhas = [];
  for (const l of p.lancamentos) {
    const ext = 'md:' + l.i;
    if (jaTem.has(ext)) continue;
    const r = { descricao: (l.ds || 'Lançamento').slice(0, 120), valor: r2(Math.abs(l.v)), data: l.d, pago: !!l.pg, conciliado: !!l.cc, observacao: l.o || null, criado_por: l.tit || null, ext_id: ext,
      categoria_id: mapCat[l.cat] || null, conta_id: null, conta_destino_id: null, cartao_id: null, fatura_mes: null, tags: [] };
    if (!(r.valor > 0)) continue;
    if (l.k) {
      r.cartao_id = mapCartao[l.k]; if (!r.cartao_id) continue;
      r.fatura_mes = (l.f || faturaYMcalc(byId('cartoes', r.cartao_id) || { dia_fechamento: 1, dia_vencimento: 10 }, l.d)) + '-01';
      if (l.t === 'p') { r.tipo = 'pagamento_fatura'; r.conta_id = mapConta[l.c] || null; r.categoria_id = null; if (!r.conta_id) continue; }
      else { r.tipo = l.t === 'r' ? 'receita' : 'despesa'; r.pago = true; }
    } else if (l.t === 't') {
      r.tipo = 'transferencia'; r.conta_id = mapConta[l.c]; r.conta_destino_id = mapConta[l.cd]; r.categoria_id = null;
      if (!r.conta_id || !r.conta_destino_id || r.conta_id === r.conta_destino_id) continue;
    } else {
      r.tipo = l.t === 'r' ? 'receita' : 'despesa'; r.conta_id = mapConta[l.c]; if (!r.conta_id) continue;
    }
    if (l.g && l.pa) {
      grupos[l.g] = grupos[l.g] || uuid(); r.grupo_id = grupos[l.g];
      if (l.pa === 'fixa') r.serie = fixasVivas.has(l.g) ? 'fixa' : 'fixa_fim';
      else { const m = String(l.pa).match(/^(\d+)\/(\d+)$/); if (m) { r.serie = 'parcelada'; r.parcela = +m[1]; r.total_parcelas = +m[2]; } }
    }
    linhas.push(r);
  }
  for (let i = 0; i < linhas.length; i += 500) {
    passo(`Gravando lançamentos… ${Math.min(i + 500, linhas.length).toLocaleString('pt-BR')} de ${linhas.length.toLocaleString('pt-BR')}`);
    await op(sb.from('lancamentos').insert(linhas.slice(i, i + 500)));
  }
  // 4) regras e metas
  passo('Importando regras e metas…');
  for (const g of p.regras || []) {
    if (S.regras.some(x => norm(x.descricao) === norm(g.descricao) && x.tipo === g.tipo)) continue;
    await op(sb.from('regras').insert({ tipo: g.tipo, descricao: g.descricao, palavras: g.palavras || null, conta_id: mapConta[g.conta] || null, cartao_id: mapCartao[g.conta] || null, titular: g.titular || null, categoria_id: mapCat[g.cat] || null }));
  }
  for (const m of p.metas || []) {
    if (S.metas.some(x => norm(x.nome) === norm(m.nome))) continue;
    await op(sb.from('metas').insert({ nome: m.nome, valor_alvo: m.valor || 1, data_alvo: m.data || null, conta_id: mapConta[m.conta] || null }));
  }
  if (!S.prefs.faturas_base || S.prefs.faturas_base < ymHoje()) { S.prefs.faturas_base = ymHoje(); await salvarPrefs(); }
  await carregar();
  _fatCache = new Map();
  M.fase = 'fim';
  M.msg = `Pronto! ${linhas.length.toLocaleString('pt-BR')} lançamentos importados${p.lancamentos.length - linhas.length ? ` (${(p.lancamentos.length - linhas.length).toLocaleString('pt-BR')} já existiam ou foram ignorados)` : ''}.`;
  render();
  try { window.opener?.postMessage({ tipo: 'nc-importado', n: linhas.length }, MD_ORIGEM); } catch {}
}

        const ao = e.target.closest('[data-anx]'); if (ao && anexos[+ao.dataset.anx]?.path) abrirDoc(anexos[+ao.dataset.anx].path);
        if (e.target.closest('[data-det-add]')) { det.push({ c: '', v: '' }); desenhaDet(); }

      }, true);
      form.addEventListener('input', e => {

      });
      form.addEventListener('change', e => {
        if (e.target.dataset.detCat !== undefined) det[+e.target.dataset.detCat].c = e.target.value;
        if (e.target.name === 'fatura') e.target.dataset.v = e.target.value;
        if (e.target.name === 'valor' && /[+\-*/]/.test(e.target.value.replace(/^-/, ''))) { const r = parseValor(e.target.value); if (!isNaN(r)) e.target.value = valorInput(r); }
        sync();
      });
      $('#fAnexo', form).addEventListener('change', e => { for (const f of e.target.files) { const a = { arquivo: f, nome: f.name }; anexos.push(a); novosArquivos.push(a); } e.target.value = ''; desenhaAnexos(); });
      $('#tipoSel')?.addEventListener('change', e => { E.tipo.value = e.target.value; if (detalhado) desenhaDet(); sync(); });
      // regras de preenchimento e sugestão pela última vez que a descrição foi usada
      E.descricao.addEventListener('change', () => {
        const d = E.descricao.value.trim(), t = E.tipo.value;

          sync();
          if (r.categoria_id && E.categoria_id) E.categoria_id.value = r.categoria_id;
          if (r.titular) E.titular.value = r.titular;
          (r.tags || []).forEach(tid => { const cb = form.querySelector(`input[name=tag][value="${tid}"]`); if (cb) cb.checked = true; });
          $('#fInfo', form).className = 'hint'; $('#fInfo', form).textContent = 'Preenchido pela regra “' + r.descricao + '”.';
        } else if (E.categoria_id && !E.categoria_id.value) {
          const ant = [...S.lancamentos].reverse().find(x => x.tipo === t && semAcento(x.descricao) === semAcento(d) && x.categoria_id);
          if (ant) E.categoria_id.value = ant.categoria_id;

      });
      desenhaAnexos(); sync();
      $('#btnDel', form.closest('.overlay'))?.addEventListener('click', () => apagarLanc(l));
      $('#btnDup', form.closest('.overlay'))?.addEventListener('click', () => { fecharModal(); formLanc(null, { ...l, tipo: l.tipo, onde: l.cartao_id ? 'cartao:' + l.cartao_id : 'conta:' + l.conta_id, titular: l.criado_por, duplicar: true, data: hoje(), pago: lsGet('nc_padrao_pago') !== '0' }); });
      form._ctx = { det, anexos, novosArquivos };
    },
    onSubmit: async (form, sub) => {
      const E = form.elements, { det, anexos, novosArquivos } = form._ctx;
      const tipo = E.tipo.value, valor = parseValor(E.valor.value), data = E.data.value;
      let descricao = E.descricao.value.trim();
      if (!(valor > 0)) return 'Informe um valor maior que zero.';
      if (!data) return 'Informe a data.';
      const base = { tipo, valor, data, descricao, observacao: E.observacao.value.trim() || null, pago: E.pago.value === '1', conciliado: E.conciliado.value === '1',
        categoria_id: null, conta_id: null, conta_destino_id: null, cartao_id: null, fatura_mes: null, criado_por: null,
